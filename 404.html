<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CINEFLIX - Loading...</title>
<script>
(function restoreRoute() {
    const activeMovieId = sessionStorage.getItem("active_movie_id");
    const lastPage = sessionStorage.getItem("last_active_page");

    if (lastPage === "server" && activeMovieId) {
        window.location.replace("/server.html");
        return;
    }

    if (lastPage === "quality" && activeMovieId) {
        window.location.replace("/quality.html");
        return;
    }

    window.location.replace("/zozomovie.github.io");
})();
</script>
<style>
body {
    background: #050505;
    color: #fff;
    font-family: sans-serif;
    display: grid;
    place-items: center;
    min-height: 100vh;
    margin: 0;
}
.spinner {
    width: 32px;
    height: 32px;
    border: 3px solid rgba(255,255,255,.1);
    border-top-color: #e50914;
    border-radius: 50%;
    animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div style="text-align: center;">
    <div class="spinner"></div>
</div>
</body>
</html>
