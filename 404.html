<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CINEFLIX - Access Protection</title>
<style>
body {
    background: #050505;
    color: #fff;
    font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
    display: grid;
    place-items: center;
    min-height: 100vh;
    margin: 0;
    overflow: hidden;
}
.spinner {
    width: 34px;
    height: 34px;
    border: 3px solid rgba(255,255,255,.1);
    border-top-color: #e50914;
    border-radius: 50%;
    animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Floating Red Toast Box */
.toast-box {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #e50914;
    color: #ffffff;
    padding: 10px 18px 10px 22px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 10px 30px rgba(229, 9, 20, 0.45);
    z-index: 999999;
    transition: opacity 0.3s ease, transform 0.3s ease;
    opacity: 1;
}
.toast-btn {
    background: #ffffff;
    color: #e50914;
    border: none;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 900;
    cursor: pointer;
    transition: transform 0.15s ease;
}
.toast-btn:active {
    transform: scale(0.92);
}
</style>
</head>
<body>

<div style="text-align: center;">
    <div class="spinner"></div>
</div>

<script>
(function handleAccessAndRedirect() {
    const path = window.location.pathname;
    const activeMovieId = sessionStorage.getItem("active_movie_id");
    const lastPage = sessionStorage.getItem("last_active_page");

    // Check 1: Valid Session for Server Page Refresh (F5)
    if ((path.includes('/server.html/') || path.match(/\/[a-z0-9]+_h$/i) || lastPage === "server") && activeMovieId) {
        window.location.replace("/server.html");
        return;
    }

    // Check 2: Valid Session for Quality Page Refresh (F5)
    if ((path.includes('/download/') || lastPage === "quality") && activeMovieId) {
        window.location.replace("/quality.html");
        return;
    }

    // Direct Access Blocked Logic
    // 1. Create Floating Toast Box instantly on current screen
    const toast = document.createElement("div");
    toast.className = "toast-box";

    const textSpan = document.createElement("span");
    textSpan.textContent = "You can't access direct URL!";

    const okBtn = document.createElement("button");
    okBtn.className = "toast-btn";
    okBtn.textContent = "OK";

    toast.appendChild(textSpan);
    toast.appendChild(okBtn);
    document.body.appendChild(toast);

    // 2. Background Redirection Setup
    let isRedirected = false;
    const executeRedirect = () => {
        if (isRedirected) return;
        isRedirected = true;
        toast.style.opacity = "0";
        toast.style.transform = "translateX(-50%) translateY(-10px)";
        setTimeout(() => {
            window.location.replace("/zozomovie.github.io");
        }, 150);
    };

    // Trigger Instant Redirect on "OK" Click
    okBtn.addEventListener("click", executeRedirect);

    // Auto Redirect in Background after 3 Seconds
    setTimeout(executeRedirect, 3000);
})();
</script>

</body>
</html>
