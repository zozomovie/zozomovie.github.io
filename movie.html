<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#02070d">
<link rel="icon" href="data:,">
<title>CINEFLIX — Movie Details</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%23e50914%22/%3E%3Cpath d=%22M24 16v32l25-16z%22 fill=%22white%22/%3E%3C/svg%3E">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* System font stack keeps the page fast and avoids a render-blocking font request. */

:root{
    --red:#e50914;
    --bg:#02070d;
    --panel:rgba(12,25,38,.72);
    --panel2:rgba(13,28,43,.9);
    --text:#f7f9ff;
    --muted:#9ca9bb;
    --line:rgba(255,255,255,.11);
    --blue:#dce9ff;
    --accent:#ffffff;
    --gold:#ffd33d;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
    min-height:100vh;
    overflow-x:hidden;
    background:
        radial-gradient(circle at 50% 0%,rgba(27,66,99,.22),transparent 40%),
        #02070d;
    color:var(--text);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
}
button{font:inherit}
button,a{tap-highlight-color:transparent;-webkit-tap-highlight-color:transparent}

.page{
    position:relative;
    min-height:100vh;
}

/* =========================
   BACKDROP
========================= */
.backdrop{
    position:absolute;
    z-index:0;
    top:72px;
    left:0;
    width:100%;
    height:min(748px,78vw);
    min-height:590px;
    overflow:hidden;
    pointer-events:none;
}
.backdrop img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 25%;
    filter:saturate(.95) brightness(.82);
    transform:scale(1.015);
}
.backdrop::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:1;
    background:
        linear-gradient(90deg,
            rgba(1,6,11,.16) 0%,
            rgba(1,6,11,.03) 48%,
            rgba(1,6,11,.20) 100%),
        linear-gradient(180deg,
            rgba(2,7,13,.18) 0%,
            rgba(2,7,13,.03) 7%,
            rgba(2,7,13,.10) 46%,
            rgba(2,7,13,.80) 78%,
            #02070d 100%);
}
.backdrop::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:2;
    background:
        radial-gradient(ellipse at 50% 25%,transparent 15%,rgba(1,5,9,.26) 100%);
}

/* =========================
   CINEFLIX HEADER — same visual language as index.html
========================= */
.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:72px;
    z-index:1000;
    display:flex;
    align-items:center;
    padding:0 4%;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,.92),
        rgba(0,0,0,.58),
        transparent
    );
    transition:.35s;
}
.header.scrolled{
    background:rgba(5,5,6,.96);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}
.logo{
    font-size:24px;
    font-weight:900;
    letter-spacing:-1.5px;
    color:#fff;
    text-decoration:none;
    display:flex;
    align-items:center;
    gap:8px;
    white-space:nowrap;
}
.logo-mark{
    width:30px;
    height:30px;
    border-radius:8px;
    background:var(--red);
    display:grid;
    place-items:center;
    box-shadow:0 5px 20px rgba(229,9,20,.35);
}
.logo-mark svg{width:17px;height:17px;fill:#fff}
.nav{
    display:flex;
    align-items:center;
    gap:27px;
    margin-left:45px;
}
.nav a{
    color:#d5d5d7;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    transition:.2s;
}
.nav a:hover,.nav a.active{color:#fff}
.nav a.active{position:relative}
.nav a.active::after{
    content:"";
    position:absolute;
    bottom:-8px;
    left:50%;
    width:5px;
    height:5px;
    background:var(--red);
    border-radius:50%;
    transform:translateX(-50%);
}
.header-right{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:18px;
}
.header .search-box{
    width:0;
    opacity:0;
    overflow:hidden;
    transition:.3s;
}
.header .search-box.open{width:210px;opacity:1}
.header .search-box input{
    width:100%;
    height:38px;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(0,0,0,.7);
    color:#fff;
    outline:none;
    border-radius:8px;
    padding:0 13px;
    font-size:13px;
}
.icon-btn{
    width:38px;
    height:38px;
    border:0;
    background:transparent;
    color:#fff;
    display:grid;
    place-items:center;
    cursor:pointer;
    border-radius:50%;
    transition:.2s;
}
.icon-btn:hover{background:rgba(255,255,255,.1)}
.icon-btn svg{
    width:20px;
    height:20px;
    stroke:currentColor;
    fill:none;
    stroke-width:1.9;
}
.profile{
    width:35px;
    height:35px;
    border-radius:50%;
    background:linear-gradient(135deg,#ff1f35,#6f0710);
    display:grid;
    place-items:center;
    font-size:12px;
    font-weight:800;
}

/* =========================
   TOP CONTROLS
========================= */
.topbar{
    position:relative;
    z-index:20;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:28px 3.1%;
}
.circle-btn{
    width:56px;
    height:56px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.16);
    background:rgba(4,8,13,.48);
    color:white;
    display:grid;
    place-items:center;
    cursor:pointer;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    transition:.22s;
}
.circle-btn:hover{
    background:rgba(255,255,255,.13);
    transform:translateY(-1px);
}
.circle-btn svg{
    width:28px;
    height:28px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
}

/* =========================
   MAIN
========================= */
.content{
    position:relative;
    z-index:5;
    width:min(1160px,94%);
    margin:0 auto;
    padding-top:125px;
    padding-bottom:65px;
}

/* =========================
   HERO DETAILS
========================= */
.movie-hero{
    max-width:780px;
}
.title{
    font-size:clamp(46px,6.5vw,78px);
    line-height:.92;
    font-weight:900;
    letter-spacing:.17em;
    text-transform:uppercase;
    text-shadow:0 5px 30px rgba(0,0,0,.6);
    margin-bottom:9px;
}
.subtitle{
    font-size:clamp(10px,1.15vw,15px);
    font-weight:700;
    letter-spacing:.52em;
    color:#d8e0eb;
    margin-bottom:22px;
}
.meta{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:9px;
    color:#dbe2ec;
    font-size:15px;
    line-height:1.6;
    margin-bottom:22px;
}
.meta .dot{opacity:.6}
.imdb{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:56px;
    height:29px;
    padding:0 8px;
    border-radius:6px;
    background:#f4c51d;
    color:#0b0b0b;
    font-size:17px;
    font-weight:900;
    letter-spacing:-1.2px;
}
.rating{
    color:#e4eaf4;
    font-weight:500;
}
.description{
    max-width:700px;
    color:#c6d0dd;
    font-size:16px;
    line-height:1.75;
    margin-bottom:26px;
}
.actions{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:20px;
}
.action{
    height:64px;
    border-radius:34px;
    border:1px solid rgba(255,255,255,.12);
    padding:0 30px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    cursor:pointer;
    font-size:16px;
    font-weight:800;
    transition:.22s;
}
.watch{
    min-width:260px;
    background:#fff;
    color:#080c12;
    box-shadow:0 14px 34px rgba(0,0,0,.22);
}
.watch:hover{transform:translateY(-2px);background:#e9edf2}
.watch svg{width:22px;height:22px;fill:currentColor}
.watch.loading{opacity:.7;pointer-events:none}
.list{
    min-width:245px;
    background:rgba(10,23,36,.76);
    color:white;
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
}
.list:hover{background:rgba(26,46,65,.9)}
.list svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9}
.share{
    width:64px;
    padding:0;
    background:rgba(10,23,36,.76);
    color:white;
    backdrop-filter:blur(15px);
}
.share:hover{background:rgba(26,46,65,.9)}
.share svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9}

/* =========================
   INFORMATION CARD
========================= */
.info-card{
    width:100%;
    overflow:hidden;
    border:1px solid rgba(164,191,220,.14);
    border-radius:21px;
    background:
        linear-gradient(135deg,rgba(22,40,58,.78),rgba(7,20,31,.76));
    box-shadow:0 20px 55px rgba(0,0,0,.22);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
}
.info-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 26px 13px;
}
.info-title{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:20px;
    font-weight:800;
}
.info-title svg{
    width:29px;
    height:29px;
    fill:#dce8f9;
}
.see-more{
    display:flex;
    align-items:center;
    gap:7px;
    color:#c4cfdd;
    background:none;
    border:0;
    cursor:pointer;
    font-size:14px;
}
.see-more svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2}

.info-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
}
.info-item{
    min-height:68px;
    padding:9px 16px 9px 20px;
    display:grid;
    grid-template-columns:34px 1fr;
    gap:13px;
    align-items:start;
    border-top:1px solid rgba(255,255,255,.08);
}
.info-item:not(:nth-child(4n+1)){
    border-left:1px solid rgba(255,255,255,.08);
}
.info-icon{
    width:29px;
    height:29px;
    color:#dce7f7;
}
.info-icon svg{
    width:100%;
    height:100%;
    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
}
.info-label{
    color:#aab7c8;
    font-size:13px;
    margin-bottom:3px;
}
.info-value{
    color:#e4eaf2;
    font-size:13px;
    line-height:1.45;
}

/* =========================
   SECTION
========================= */
.section{
    margin-top:20px;
}
.section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:0 10px 13px;
}
.section-title{
    display:flex;
    align-items:center;
    gap:13px;
    font-size:20px;
    font-weight:800;
}
.section-title svg{
    width:28px;
    height:28px;
    fill:#f2f6ff;
}
.section-side{
    color:#c6cfdd;
    font-size:13px;
    display:flex;
    align-items:center;
    gap:8px;
}
.section-side svg{
    width:16px;height:16px;
    fill:none;stroke:currentColor;stroke-width:2;
}

/* =========================
   CLIPS
========================= */
.clips-wrap{
    position:relative;
}
.clip-card{
    position:relative;
    width:100%;
    aspect-ratio:16/6.25;
    min-height:260px;
    overflow:hidden;
    border-radius:19px;
    border:1px solid rgba(255,255,255,.1);
    background:#09131e;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}
.clip-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter:brightness(.78) saturate(.95);
}
.clip-card::after{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(180deg,transparent 35%,rgba(0,0,0,.78) 100%),
        linear-gradient(90deg,rgba(0,0,0,.2),transparent 50%,rgba(0,0,0,.22));
}
.clip-quote{
    position:absolute;
    z-index:2;
    left:50%;
    bottom:43px;
    transform:translateX(-50%);
    width:85%;
    text-align:center;
    color:#e9edf4;
    font-size:clamp(12px,1.3vw,16px);
    letter-spacing:.25em;
    font-weight:500;
}
.clip-dots{
    position:absolute;
    z-index:4;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    display:flex;
    gap:13px;
}
.clip-dot{
    width:33px;
    height:5px;
    border:0;
    border-radius:10px;
    background:rgba(255,255,255,.22);
    cursor:pointer;
}
.clip-dot.active{background:#e9f2ff}
.clip-arrow{
    position:absolute;
    z-index:5;
    top:50%;
    transform:translateY(-50%);
    width:49px;
    height:49px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(3,10,16,.52);
    color:#e9eff8;
    display:grid;
    place-items:center;
    cursor:pointer;
    backdrop-filter:blur(10px);
}
.clip-arrow:hover{background:rgba(255,255,255,.13)}
.clip-arrow svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}
.clip-prev{left:8px}.clip-next{right:8px}

/* =========================
   CAST
========================= */
.cast-row{
    display:flex;
    gap:24px;
    overflow-x:auto;
    overflow-y:hidden;
    padding:7px 8px 12px;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
    scroll-snap-type:x proximity;
    overscroll-behavior-x:contain;
    touch-action:pan-x;
    cursor:grab;
}
.cast-row:active{cursor:grabbing}
.cast-row::-webkit-scrollbar{display:none}
.cast-person{
    scroll-snap-align:start;
}
.cast-person{
    flex:0 0 102px;
    text-align:center;
    scroll-snap-align:start;
}
.cast-photo{
    width:88px;
    height:88px;
    margin:0 auto 11px;
    border-radius:50%;
    overflow:hidden;
    border:2px solid rgba(255,255,255,.16);
    background:#15212d;
    box-shadow:0 7px 25px rgba(0,0,0,.3);
}
.cast-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}
.cast-name{
    font-size:13px;
    line-height:1.25;
    font-weight:800;
}
.cast-role{
    margin-top:5px;
    color:#8897aa;
    font-size:12px;
    line-height:1.25;
}

/* =========================
   SIMILAR MOVIES
========================= */
.similar-row{
    display:grid;
    grid-template-columns:repeat(6,minmax(0,1fr));
    gap:14px;
    padding:5px 4px 15px;
}
.poster-card{
    width:100%;
    aspect-ratio:2/3;
    overflow:hidden;
    border-radius:10px;
    position:relative;
    background:#101a24;
    cursor:pointer;
    border:1px solid rgba(255,255,255,.07);
}
.poster-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.3s;
}
.poster-card:hover img{transform:scale(1.05)}
.poster-gradient{
    position:absolute;
    inset:0;
    background:linear-gradient(transparent 48%,rgba(0,0,0,.9));
}
.poster-name{
    position:absolute;
    z-index:2;
    left:10px;
    right:10px;
    bottom:10px;
    font-size:12px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* =========================
   CENTER PLAYER POPUP
========================= */
.player-overlay{
    position:fixed;
    inset:0;
    z-index:3000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px;
    background:rgba(0,0,0,.82);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    opacity:0;
    visibility:hidden;
    transition:.22s ease;
}
.player-overlay.open{
    opacity:1;
    visibility:visible;
}
.player-box{
    position:relative;
    width:min(1000px,94vw);
    aspect-ratio:16/9;
    background:#000;
    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 30px 100px rgba(0,0,0,.7);
    transform:scale(.96);
    transition:.22s ease;
}
.player-overlay.open .player-box{transform:scale(1)}
.player-video{
    width:100%;
    height:100%;
    display:block;
    background:#000;
    object-fit:contain;
}
.player-close{
    position:absolute;
    z-index:5;
    top:12px;
    right:12px;
    width:42px;
    height:42px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:50%;
    background:rgba(0,0,0,.65);
    color:#fff;
    display:grid;
    place-items:center;
    cursor:pointer;
    backdrop-filter:blur(10px);
}
.player-close svg{
    width:21px;
    height:21px;
    fill:none;
    stroke:currentColor;
    stroke-width:2;
}
.player-empty{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    padding:30px;
    text-align:center;
    color:#d7deea;
    background:#050505;
    font-size:14px;
    line-height:1.6;
}
.player-empty strong{
    display:block;
    color:#fff;
    font-size:17px;
    margin-bottom:6px;
}
.player-loading{
    position:absolute;
    inset:0;
    z-index:3;
    display:grid;
    place-items:center;
    background:rgba(0,0,0,.35);
}
.player-loading .loader{margin:0}

@media(max-width:600px){
    .player-overlay{padding:12px}
    .player-box{
        width:100%;
        border-radius:10px;
    }
    .player-close{
        width:36px;
        height:36px;
        top:8px;
        right:8px;
    }
}

/* =========================
   LOADING / ERROR
========================= */
.loading{
    min-height:100vh;
    display:grid;
    place-items:center;
    color:#b9c5d4;
    font-size:14px;
}
.loader{
    width:28px;height:28px;
    border:2px solid rgba(255,255,255,.18);
    border-top-color:white;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:auto auto 13px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{
    width:min(560px,90%);
    text-align:center;
    padding:35px 25px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:18px;
    background:rgba(13,25,37,.8);
}
.error-box h2{font-size:21px;margin-bottom:8px}
.error-box p{color:#9ba9ba;font-size:13px;line-height:1.6}

/* =========================
   HIDDEN HELPERS
========================= */
.hidden{display:none!important}

/* =========================
   TABLET
========================= */
@media(max-width:900px){
    .content{
        width:min(94%,720px);
        padding-top:120px;
    }
    .backdrop{
        height:720px;
        min-height:560px;
    }
    .title{
        font-size:clamp(38px,8vw,62px);
        letter-spacing:.12em;
    }
    .info-grid{grid-template-columns:repeat(2,1fr)}
    .info-item:not(:nth-child(4n+1)){border-left:0}
    .info-item:nth-child(odd){border-right:1px solid rgba(255,255,255,.08)}
    .info-item:nth-child(even){border-left:0}
    .clip-card{aspect-ratio:16/7}
    .similar-row{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
}

/* =========================
   PHONE
========================= */
@media(max-width:600px){
    .header{
        height:62px;
        padding:0 18px;
    }
    .backdrop{
        top:62px;
    }
    .logo{font-size:20px}
    .logo-mark{width:27px;height:27px}
    .nav{display:none}
    .header-right{gap:5px}
    .header .search-box.open{
        position:absolute;
        top:58px;
        left:15px;
        right:15px;
        width:auto;
    }
    .profile{width:32px;height:32px}

    body{
        background:
            radial-gradient(circle at 50% 0%,rgba(27,66,99,.17),transparent 32%),
            #02070d;
    }
    /* Shorter cinematic thumbnail/backdrop on phones */
    .backdrop{
        top:62px;
        height:390px;
        min-height:0;
    }
    .backdrop img{
        object-position:center top;
        filter:brightness(.72) saturate(.92);
    }
    .backdrop::before{
        background:
            linear-gradient(180deg,rgba(0,0,0,.03),rgba(2,7,13,.15) 35%,rgba(2,7,13,.82) 71%,#02070d 100%);
    }

    .content{
        width:calc(100% - 28px);

<script>
/* =========================================================
   CINEFLIX MOVIE DETAILS
   Uses the same Supabase project as your homepage.
   Homepage currently stores movie poster as poster_url.
   ========================================================= */

const SUPABASE_URL = "https://bbqaagbypawcpszjwzii.supabase.co";
const SUPABASE_KEY = "sb_publishable_dWktR3La6JpSwD32tfSb-Q_a__jx0cO";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/*
   Optional TMDB API key.

   The page DOES NOT require this key when your Supabase row already
   contains poster_url / backdrop_url / tmdb_id.

   If your admin stores tmdb_id but does not store the TMDB images,
   put your TMDB API Read Access Token/API key here.
*/
const TMDB_API_KEY = "eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJiZmI5NmFlN2JmYWVjYWU4ZTc3NDY4YzhlODQxZGZlNSIsIm5iZiI6MTc4NzYwOTY2NS45MjEsInN1YiI6IjZhOGNjMjQxYzI2NzdiZjk4NDM3NmIyZCIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.NSJNKOk7gShLFeAc5susNm8QTDeGmRAk4qQvSjAQdP4"; // TMDB API Read Access Token

/* Change only this if your watch/quality page has another filename. */
const WATCH_PAGE = "quality.html";

const params = new URLSearchParams(location.search);
const movieId = params.get("id");

const app = document.getElementById("app");

const esc = value => String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

const first = (...values) =>
    values.find(v => v !== undefined && v !== null && String(v).trim() !== "");

const arr = value => {
    if(Array.isArray(value)) return value;
    if(typeof value === "string"){
        try{
            const parsed = JSON.parse(value);
            if(Array.isArray(parsed)) return parsed;
        }catch(e){}
        return value.split(",").map(x=>x.trim()).filter(Boolean);
    }
    return [];
};

const val = (obj, keys, fallback="") => {
    for(const key of keys){
        if(obj && obj[key] !== undefined && obj[key] !== null && String(obj[key]).trim() !== ""){
            return obj[key];
        }
    }
    return fallback;
};

function imageFrom(value, fallback=""){
    if(!value) return fallback;
    if(typeof value === "object"){
        return first(value.url,value.src,value.file_path,value.path,fallback);
    }
    return String(value);
}

function tmdbImage(path,size="original"){
    if(!path) return "";
    if(/^https?:\/\//i.test(path)) return path;
    if(String(path).startsWith("//")) return "https:"+path;
    return `https://image.tmdb.org/t/p/${size}${String(path).startsWith("/") ? path : "/"+path}`;
}

function formatRuntime(runtime){
    if(runtime === undefined || runtime === null || runtime === "") return "";
    if(typeof runtime === "number"){
        const h = Math.floor(runtime/60);
        const m = runtime % 60;
        return h ? `${h}h ${m}m` : `${m}m`;
    }
    return String(runtime);
}

function getGenres(movie){
    const raw = first(movie.genres,movie.genre,movie.category,"");
    const list = arr(raw);

    return list.map(g=>{
        if(typeof g === "string") return g;
        return first(g.name,g.title,"");
    }).filter(Boolean);
}

function getPeople(movie){
    const candidates = [
        movie.cast, movie.cast_crew, movie.credits,
        movie.actors, movie.cast_json, movie.crew
    ];

    for(const raw of candidates){
        if(!raw) continue;
        if(Array.isArray(raw)) return raw;

        if(typeof raw === "string"){
            try{
                const parsed = JSON.parse(raw);
                if(Array.isArray(parsed)) return parsed;
                if(parsed && Array.isArray(parsed.cast)) return parsed.cast;
                if(parsed && Array.isArray(parsed.credits)) return parsed.credits;
            }catch(e){
                const simple = raw.split(/[,\n|]+/).map(x=>x.trim()).filter(Boolean);
                if(simple.length) return simple;
            }
        }

        if(typeof raw === "object"){
            if(Array.isArray(raw.cast)) return raw.cast;
            if(Array.isArray(raw.credits)) return raw.credits;
            if(Array.isArray(raw.crew)) return raw.crew;
        }
    }
    return [];
}

function getPoster(movie,tmdb){
    return first(
        imageFrom(movie.poster_url),
        imageFrom(movie.poster),
        imageFrom(movie.thumbnail),
        tmdbImage(tmdb?.poster_path,"w780"),
        "https://via.placeholder.com/780x1170/0b1420/ffffff?text=CINEFLIX"
    );
}

function getBackdrop(movie,tmdb){
    /*
      Priority:
      1) Supabase backdrop URL
      2) Supabase TMDB backdrop_path
      3) TMDB API backdrop_path
      4) poster as last fallback
    */
    return first(
        imageFrom(movie.backdrop_url),
        imageFrom(movie.backdrop),
        imageFrom(movie.backdrop_image),
        imageFrom(movie.hero_image),
        tmdbImage(first(
            movie.tmdb_backdrop_path,
            movie.tmdbBackdropPath,
            movie.backdrop_path
        ),"original"),
        tmdbImage(tmdb?.backdrop_path,"original"),
        getPoster(movie,tmdb)
    );
}

/* =========================================================
   TMDB
========================================================= */

async function fetchTMDB(movie){
    const token = String(TMDB_API_KEY || "").trim();
    if(!token) return null;

    const headers = {
        accept: "application/json",
        Authorization: `Bearer ${token}`
    };

    try{
        const explicitId = first(
            movie.tmdb_id,
            movie.tmdbId,
            movie.tmdb_movie_id,
            movie.tmdb_movieid
        );

        let movieIdToFetch = explicitId;

        if(!movieIdToFetch){
            const title = first(movie.title,movie.name);
            if(!title) return null;

            const year = first(movie.year,movie.release_year,"");
            const url = new URL("https://api.themoviedb.org/3/search/movie");
            url.searchParams.set("query",title);
            url.searchParams.set("language","en-US");
            url.searchParams.set("page","1");
            url.searchParams.set("include_adult","false");
            if(year) url.searchParams.set("year",year);

            const response = await fetch(url,{headers});
            if(!response.ok) return null;

            const data = await response.json();
            const results = Array.isArray(data?.results) ? data.results : [];
            if(!results.length) return null;

            /* Prefer an exact title match; otherwise use TMDB's top result. */
            const wanted = String(title).trim().toLowerCase();
            const exact = results.find(item =>
                String(item?.title || item?.name || "").trim().toLowerCase() === wanted
            );
            movieIdToFetch = (exact || results[0])?.id;
            if(!movieIdToFetch) return null;
        }

        const detailUrl = new URL(`https://api.themoviedb.org/3/movie/${encodeURIComponent(movieIdToFetch)}`);
        detailUrl.searchParams.set("language","en-US");
        detailUrl.searchParams.set("append_to_response","credits,images,videos");
        detailUrl.searchParams.set("include_image_language","en,null");

        const detailResponse = await fetch(detailUrl,{headers});
        if(!detailResponse.ok) return null;

        return await detailResponse.json();
    }catch(error){
        console.warn("TMDB metadata unavailable:",error);
        return null;
    }
}

function showError(title,text){
    app.innerHTML = `
        <div class="loading">
            <div class="error-box">
                <h2>${esc(title)}</h2>
                <p>${esc(text)}</p>
            </div>
        </div>
    `;
}
