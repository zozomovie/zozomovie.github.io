<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cineflix - Select Download Server</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}
html{
    min-height:100%;
}
body{
    min-height:100vh;
    font-family:Inter,Arial,Helvetica,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 50% -10%, rgba(255,255,255,.055), transparent 30%),
        radial-gradient(circle at 100% 35%, rgba(229,9,20,.08), transparent 30%),
        #050505;
}
.navbar{
    width:100%;
    height:64px;
    padding:0 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(5,5,5,.76);
    border-bottom:1px solid rgba(255,255,255,.065);
    backdrop-filter:blur(20px);
}
.logo{
    color:#fff;
    font-size:21px;
    font-weight:900;
    letter-spacing:1.8px;
    text-decoration:none;
}
.logo span{
    color:#e50914;
}
.page{
    width:100%;
    max-width:760px;
    margin:0 auto;
    padding:34px 22px 55px;
}
.movie-header{
    margin-bottom:26px;
}
.movie-title{
    max-width:700px;
    color:#fff;
    font-size:clamp(22px,3.2vw,32px);
    line-height:1.2;
    font-weight:850;
}
.file-info{
    margin-top:9px;
    display:flex;
    align-items:center;
    gap:8px;
    color:#777;
    font-size:13px;
    font-weight:650;
}
.file-quality{
    color:#e50914;
    font-weight:800;
}
.section-label{
    width:100%;
    display:flex;
    align-items:center;
    gap:11px;
    margin-bottom:13px;
    color:#666;
    font-size:10px;
    font-weight:800;
    letter-spacing:1.5px;
    text-transform:uppercase;
}
.section-label::after{
    content:"";
    height:1px;
    flex:1;
    background:rgba(255,255,255,.07);
}
.server-list{
    width:100%;
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
}
.server-card{
    width:100%;
    height:57px;
    display:flex;
    align-items:center;
    padding:0 12px;
    position:relative;
    color:#fff;
    text-decoration:none;
    cursor:pointer;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.075);
    background:linear-gradient(105deg, rgba(255,255,255,.047), rgba(255,255,255,.015));
    transition:transform .18s ease, border-color .18s ease;
}
.server-card:hover{
    transform:translateY(-2px);
    border-color:rgba(229,9,20,.34);
    background:linear-gradient(105deg, rgba(229,9,20,.075), rgba(255,255,255,.02));
}
.server-number{
    width:27px;
    height:27px;
    min-width:27px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    background:#101010;
    border:1px solid rgba(255,255,255,.075);
    color:#e50914;
    font-size:9px;
    font-weight:900;
}
.server-content{
    flex:1;
    min-width:0;
    margin-left:12px;
    text-align:left;
}
.server-name{
    color:#e9e9e9;
    font-size:13.5px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
.server-desc{
    margin-top:2px;
    color:#666;
    font-size:9.5px;
}
.loading-msg{
    text-align:center;
    padding:40px 0;
    color:#888;
    font-size:13px;
}
.spinner{
    width:32px;
    height:32px;
    margin:0 auto 10px;
    border:3px solid rgba(255,255,255,.1);
    border-top-color:#e50914;
    border-radius:50%;
    animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<nav class="navbar">
    <a href="/index.html" class="logo">CINE<span>FLIX</span></a>
</nav>

<main class="page">
    <div class="movie-header">
        <h1 class="movie-title" id="movieTitle">Loading Movie...</h1>
        <div class="file-info">
            <span class="file-quality" id="qualityText">Selected Quality</span>
            <span class="separator">•</span>
            <span>Direct Mirror Servers</span>
        </div>
    </div>

    <div class="section-label">Choose Download Server</div>

    <div class="server-list" id="serverContainer">
        <div class="loading-msg">
            <div class="spinner"></div>
            Fetching servers from database...
        </div>
    </div>
</main>

<script>
// ==========================================
// CLEAN URL MASKING: /random13digit/server.html
// ==========================================
const params = new URLSearchParams(window.location.search);
let movieId = params.get("id") || sessionStorage.getItem("active_movie_id");
let qIndex = parseInt(params.get("q_index") || sessionStorage.getItem("active_q_index") || "0", 10);
let movieTitle = params.get("title") || sessionStorage.getItem("active_movie_title") || "Movie Download";
let qualityName = params.get("quality") || sessionStorage.getItem("active_quality_name") || "HD Quality";
let randomRef = params.get("ref") || sessionStorage.getItem("active_server_ref") || "v8x9a2k1m4z0p";

(function protectAndMaskServerPage() {
    if (!movieId) {
        alert("Direct server access prohibited!");
        window.location.href = "/index.html";
        return;
    }

    const hasAccess = sessionStorage.getItem(`access_server_${movieId}_${qIndex}`) || sessionStorage.getItem(`auth_server_${movieId}_${qIndex}`);

    if (!hasAccess) {
        alert("Direct server access prohibited!");
        window.location.href = "/index.html";
        return;
    }

    // Exact Target Display: https://zozomovie.github.io/randomTextAndnuber13digit/server.html
    if (window.history.pushState && randomRef) {
        const customServerUrl = window.location.protocol + "//" + window.location.host + '/' + randomRef + '/server.html';
        window.history.pushState({ path: customServerUrl }, '', customServerUrl);
    }
})();

document.getElementById("movieTitle").textContent = movieTitle;
document.getElementById("qualityText").textContent = qualityName;

function esc(s){ return String(s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }

const SUPABASE_URL = "https://bbqaagbypawcpszjwzii.supabase.co";
const SUPABASE_KEY = "sb_publishable_dWktR3La6JpSwD32tfSb-Q_a__jx0cO";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadServersFromSupabase() {
    const container = document.getElementById("serverContainer");

    if (!movieId) {
        container.innerHTML = `<div class="loading-msg">Movie ID missing.</div>`;
        return;
    }

    try {
        const { data, error } = await supabaseClient
            .from("movies")
            .select("qualities_data")
            .eq("id", movieId)
            .single();

        if (error || !data || !data.qualities_data) {
            throw new Error("Servers data not found.");
        }

        const selectedQualityObj = data.qualities_data[qIndex];
        const servers = selectedQualityObj?.servers || [];

        if (servers.length === 0) {
            container.innerHTML = `<div class="loading-msg">No servers available.</div>`;
            return;
        }

        container.innerHTML = servers.map((srv, idx) => {
            const num = (idx + 1).toString().padStart(2, '0');
            return `
                <a href="${esc(srv.url)}" target="_blank" class="server-card">
                    <div class="server-number">${num}</div>
                    <div class="server-content">
                        <div class="server-name">${esc(srv.server_name)}</div>
                        <div class="server-desc">High speed connection</div>
                    </div>
                </a>
            `;
        }).join("");

    } catch (err) {
        container.innerHTML = `<div class="loading-msg">Error loading servers: ${esc(err.message)}</div>`;
    }
}

loadServersFromSupabase();
</script>

</body>
</html>
