<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CINEFLIX - Access Protection</title>
<style>
body {
    background: #050505;
    color: #fff;
    font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
    display: grid;
    place-items: center;
    min-height: 100vh;
    margin: 0;
    overflow: hidden;
}
.spinner {
    width: 34px;
    height: 34px;
    border: 3px solid rgba(255,255,255,.1);
    border-top-color: #e50914;
    border-radius: 50%;
    animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Floating Red Toast Box */
.toast-box {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #e50914;
    color: #ffffff;
    padding: 10px 18px 10px 22px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 10px 30px rgba(229, 9, 20, 0.45);
    z-index: 999999;
    transition: opacity 0.3s ease, transform 0.3s ease;
    opacity: 1;
}
.toast-btn {
    background: #ffffff;
    color: #e50914;
    border: none;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 900;
    cursor: pointer;
    transition: transform 0.15s ease;
}
.toast-btn:active {
    transform: scale(0.92);
}
</style>
</head>
<body>

<div style="text-align: center;">

</div>
