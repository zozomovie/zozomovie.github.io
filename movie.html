<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#02070d">
<link rel="icon" href="data:,">
<title>CINEFLIX — Movie Details</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%23e50914%22/%3E%3Cpath d=%22M24 16v32l25-16z%22 fill=%22white%22/%3E%3C/svg%3E">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* System font stack keeps the page fast and avoids a render-blocking font request. */

:root{
    --red:#e50914;
    --bg:#02070d;
    --panel:rgba(12,25,38,.72);
    --panel2:rgba(13,28,43,.9);
    --text:#f7f9ff;
    --muted:#9ca9bb;
    --line:rgba(255,255,255,.11);
    --blue:#dce9ff;
    --accent:#ffffff;
    --gold:#ffd33d;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
    min-height:100vh;
    overflow-x:hidden;
    background:
        radial-gradient(circle at 50% 0%,rgba(27,66,99,.22),transparent 40%),
        #02070d;
    color:var(--text);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
}
button{font:inherit}
button,a{tap-highlight-color:transparent;-webkit-tap-highlight-color:transparent}

.page{
    position:relative;
    min-height:100vh;
}

/* =========================
   BACKDROP
========================= */
.backdrop{
    position:absolute;
    z-index:0;
    top:72px;
    left:0;
    width:100%;
    height:min(748px,78vw);
    min-height:590px;
    overflow:hidden;
    pointer-events:none;
}
.backdrop img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 25%;
    filter:saturate(.95) brightness(.82);
    transform:scale(1.015);
}
.backdrop::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:1;
    background:
        linear-gradient(90deg,
            rgba(1,6,11,.16) 0%,
            rgba(1,6,11,.03) 48%,
            rgba(1,6,11,.20) 100%),
        linear-gradient(180deg,
            rgba(2,7,13,.18) 0%,
            rgba(2,7,13,.03) 7%,
            rgba(2,7,13,.10) 46%,
            rgba(2,7,13,.80) 78%,
            #02070d 100%);
}
.backdrop::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:2;
    background:
        radial-gradient(ellipse at 50% 25%,transparent 15%,rgba(1,5,9,.26) 100%);
}

/* =========================
   CINEFLIX HEADER — same visual language as index.html
========================= */
.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:72px;
    z-index:1000;
    display:flex;
    align-items:center;
    padding:0 4%;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,.92),
        rgba(0,0,0,.58),
        transparent
    );
    transition:.35s;
}
.header.scrolled{
    background:rgba(5,5,6,.96);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}
.logo{
    font-size:24px;
    font-weight:900;
    letter-spacing:-1.5px;
    color:#fff;
    text-decoration:none;
    display:flex;
    align-items:center;
    gap:8px;
    white-space:nowrap;
}
.logo-mark{
    width:30px;
    height:30px;
    border-radius:8px;
    background:var(--red);
    display:grid;
    place-items:center;
    box-shadow:0 5px 20px rgba(229,9,20,.35);
}
.logo-mark svg{width:17px;height:17px;fill:#fff}
.nav{
    display:flex;
    align-items:center;
    gap:27px;
    margin-left:45px;
}
.nav a{
    color:#d5d5d7;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    transition:.2s;
}
.nav a:hover,.nav a.active{color:#fff}
.nav a.active{position:relative}
.nav a.active::after{
    content:"";
    position:absolute;
    bottom:-8px;
    left:50%;
    width:5px;
    height:5px;
    background:var(--red);
    border-radius:50%;
    transform:translateX(-50%);
}
.header-right{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:18px;
}
.header .search-box{
    width:0;
    opacity:0;
    overflow:hidden;
    transition:.3s;
}
.header .search-box.open{width:210px;opacity:1}
.header .search-box input{
    width:100%;
    height:38px;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(0,0,0,.7);
    color:#fff;
    outline:none;
    border-radius:8px;
    padding:0 13px;
    font-size:13px;
}
.icon-btn{
    width:38px;
    height:38px;
    border:0;
    background:transparent;
    color:#fff;
    display:grid;
    place-items:center;
    cursor:pointer;
    border-radius:50%;
    transition:.2s;
}
.icon-btn:hover{background:rgba(255,255,255,.1)}
.icon-btn svg{
    width:20px;
    height:20px;
    stroke:currentColor;
    fill:none;
    stroke-width:1.9;
}
.profile{
    width:35px;
    height:35px;
    border-radius:50%;
    background:linear-gradient(135deg,#ff1f35,#6f0710);
    display:grid;
    place-items:center;
    font-size:12px;
    font-weight:800;
}

/* =========================
   TOP CONTROLS
========================= */
.topbar{
    position:relative;
    z-index:20;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:28px 3.1%;
}
.circle-btn{
    width:56px;
    height:56px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.16);
    background:rgba(4,8,13,.48);
    color:white;
    display:grid;
    place-items:center;
    cursor:pointer;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    transition:.22s;
}
.circle-btn:hover{
    background:rgba(255,255,255,.13);
    transform:translateY(-1px);
}
.circle-btn svg{
    width:28px;
    height:28px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
}

/* =========================
   MAIN
========================= */
.content{
    position:relative;
    z-index:5;
    width:min(1160px,94%);
    margin:0 auto;
    padding-top:125px;
    padding-bottom:65px;
}

/* =========================
   HERO DETAILS
========================= */
.movie-hero{
    max-width:780px;
}
.title{
    font-size:clamp(46px,6.5vw,78px);
    line-height:.92;
    font-weight:900;
    letter-spacing:.17em;
    text-transform:uppercase;
    text-shadow:0 5px 30px rgba(0,0,0,.6);
    margin-bottom:9px;
}
.subtitle{
    font-size:clamp(10px,1.15vw,15px);
    font-weight:700;
    letter-spacing:.52em;
    color:#d8e0eb;
    margin-bottom:22px;
}
.meta{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:9px;
    color:#dbe2ec;
    font-size:15px;
    line-height:1.6;
    margin-bottom:22px;
}
.meta .dot{opacity:.6}
.imdb{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:56px;
    height:29px;
    padding:0 8px;
    border-radius:6px;
    background:#f4c51d;
    color:#0b0b0b;
    font-size:17px;
    font-weight:900;
    letter-spacing:-1.2px;
}
.rating{
    color:#e4eaf4;
    font-weight:500;
}
.description{
    max-width:700px;
    color:#c6d0dd;
    font-size:16px;
    line-height:1.75;
    margin-bottom:26px;
}
.actions{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:20px;
}
.action{
    height:64px;
    border-radius:34px;
    border:1px solid rgba(255,255,255,.12);
    padding:0 30px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    cursor:pointer;
    font-size:16px;
    font-weight:800;
    transition:.22s;
}
.watch{
    min-width:260px;
    background:#fff;
    color:#080c12;
    box-shadow:0 14px 34px rgba(0,0,0,.22);
}
.watch:hover{transform:translateY(-2px);background:#e9edf2}
.watch svg{width:22px;height:22px;fill:currentColor}
.watch.loading{opacity:.7;pointer-events:none}
.list{
    min-width:245px;
    background:rgba(10,23,36,.76);
    color:white;
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
}
.list:hover{background:rgba(26,46,65,.9)}
.list svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9}
.share{
    width:64px;
    padding:0;
    background:rgba(10,23,36,.76);
    color:white;
    backdrop-filter:blur(15px);
}
.share:hover{background:rgba(26,46,65,.9)}
.share svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9}

/* =========================
   INFORMATION CARD
========================= */
.info-card{
    width:100%;
    overflow:hidden;
    border:1px solid rgba(164,191,220,.14);
    border-radius:21px;
    background:
        linear-gradient(135deg,rgba(22,40,58,.78),rgba(7,20,31,.76));
    box-shadow:0 20px 55px rgba(0,0,0,.22);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
}
.info-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 26px 13px;
}
.info-title{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:20px;
    font-weight:800;
}
.info-title svg{
    width:29px;
    height:29px;
    fill:#dce8f9;
}
.see-more{
    display:flex;
    align-items:center;
    gap:7px;
    color:#c4cfdd;
    background:none;
    border:0;
    cursor:pointer;
    font-size:14px;
}
.see-more svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2}

.info-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
}
.info-item{
    min-height:68px;
    padding:9px 16px 9px 20px;
    display:grid;
    grid-template-columns:34px 1fr;
    gap:13px;
    align-items:start;
    border-top:1px solid rgba(255,255,255,.08);
}
.info-item:not(:nth-child(4n+1)){
    border-left:1px solid rgba(255,255,255,.08);
}
.info-icon{
    width:29px;
    height:29px;
    color:#dce7f7;
}
.info-icon svg{
    width:100%;
    height:100%;
    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
}
.info-label{
    color:#aab7c8;
    font-size:13px;
    margin-bottom:3px;
}
.info-value{
    color:#e4eaf2;
    font-size:13px;
    line-height:1.45;
}

/* =========================
   SECTION
========================= */
.section{
    margin-top:20px;
}
.section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:0 10px 13px;
}
.section-title{
    display:flex;
    align-items:center;
    gap:13px;
    font-size:20px;
    font-weight:800;
}
.section-title svg{
    width:28px;
    height:28px;
    fill:#f2f6ff;
}
.section-side{
    color:#c6cfdd;
    font-size:13px;
    display:flex;
    align-items:center;
    gap:8px;
}
.section-side svg{
    width:16px;height:16px;
    fill:none;stroke:currentColor;stroke-width:2;
}

/* =========================
   CLIPS
========================= */
.clips-wrap{
    position:relative;
}
.clip-card{
    position:relative;
    width:100%;
    aspect-ratio:16/6.25;
    min-height:260px;
    overflow:hidden;
    border-radius:19px;
    border:1px solid rgba(255,255,255,.1);
    background:#09131e;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}
.clip-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter:brightness(.78) saturate(.95);
}
.clip-card::after{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(180deg,transparent 35%,rgba(0,0,0,.78) 100%),
        linear-gradient(90deg,rgba(0,0,0,.2),transparent 50%,rgba(0,0,0,.22));
}
.clip-quote{
    position:absolute;
    z-index:2;
    left:50%;
    bottom:43px;
    transform:translateX(-50%);
    width:85%;
    text-align:center;
    color:#e9edf4;
    font-size:clamp(12px,1.3vw,16px);
    letter-spacing:.25em;
    font-weight:500;
}
.clip-dots{
    position:absolute;
    z-index:4;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    display:flex;
    gap:13px;
}
.clip-dot{
    width:33px;
    height:5px;
    border:0;
    border-radius:10px;
    background:rgba(255,255,255,.22);
    cursor:pointer;
}
.clip-dot.active{background:#e9f2ff}
.clip-arrow{
    position:absolute;
    z-index:5;
    top:50%;
    transform:translateY(-50%);
    width:49px;
    height:49px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(3,10,16,.52);
    color:#e9eff8;
    display:grid;
    place-items:center;
    cursor:pointer;
    backdrop-filter:blur(10px);
}
.clip-arrow:hover{background:rgba(255,255,255,.13)}
.clip-arrow svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}
.clip-prev{left:8px}.clip-next{right:8px}

/* =========================
   CAST
========================= */
.cast-row{
    display:flex;
    gap:24px;
    overflow-x:auto;
    overflow-y:hidden;
    padding:7px 8px 12px;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
    scroll-snap-type:x proximity;
    overscroll-behavior-x:contain;
    touch-action:pan-x;
    cursor:grab;
}
.cast-row:active{cursor:grabbing}
.cast-row::-webkit-scrollbar{display:none}
.cast-person{
    scroll-snap-align:start;
}
.cast-person{
    flex:0 0 102px;
    text-align:center;
    scroll-snap-align:start;
}
.cast-photo{
    width:88px;
    height:88px;
    margin:0 auto 11px;
    border-radius:50%;
    overflow:hidden;
    border:2px solid rgba(255,255,255,.16);
    background:#15212d;
    box-shadow:0 7px 25px rgba(0,0,0,.3);
}
.cast-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}
.cast-name{
    font-size:13px;
    line-height:1.25;
    font-weight:800;
}
.cast-role{
    margin-top:5px;
    color:#8897aa;
    font-size:12px;
    line-height:1.25;
}

/* =========================
   SIMILAR MOVIES
========================= */
.similar-row{
    display:grid;
    grid-template-columns:repeat(6,minmax(0,1fr));
    gap:14px;
    padding:5px 4px 15px;
}
.poster-card{
    width:100%;
    aspect-ratio:2/3;
    overflow:hidden;
    border-radius:10px;
    position:relative;
    background:#101a24;
    cursor:pointer;
    border:1px solid rgba(255,255,255,.07);
}
.poster-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.3s;
}
.poster-card:hover img{transform:scale(1.05)}
.poster-gradient{
    position:absolute;
    inset:0;
    background:linear-gradient(transparent 48%,rgba(0,0,0,.9));
}
.poster-name{
    position:absolute;
    z-index:2;
    left:10px;
    right:10px;
    bottom:10px;
    font-size:12px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* =========================
   CENTER PLAYER POPUP
========================= */
.player-overlay{
    position:fixed;
    inset:0;
    z-index:3000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px;
    background:rgba(0,0,0,.82);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    opacity:0;
    visibility:hidden;
    transition:.22s ease;
}
.player-overlay.open{
    opacity:1;
    visibility:visible;
}
.player-box{
    position:relative;
    width:min(1000px,94vw);
    aspect-ratio:16/9;
    background:#000;
    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 30px 100px rgba(0,0,0,.7);
    transform:scale(.96);
    transition:.22s ease;
}
.player-overlay.open .player-box{transform:scale(1)}
.player-video{
    width:100%;
    height:100%;
    display:block;
    background:#000;
    object-fit:contain;
}
.player-close{
    position:absolute;
    z-index:5;
    top:12px;
    right:12px;
    width:42px;
    height:42px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:50%;
    background:rgba(0,0,0,.65);
    color:#fff;
    display:grid;
    place-items:center;
    cursor:pointer;
    backdrop-filter:blur(10px);
}
.player-close svg{
    width:21px;
    height:21px;
    fill:none;
    stroke:currentColor;
    stroke-width:2;
}
.player-empty{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    padding:30px;
    text-align:center;
    color:#d7deea;
    background:#050505;
    font-size:14px;
    line-height:1.6;
}
.player-empty strong{
    display:block;
    color:#fff;
    font-size:17px;
    margin-bottom:6px;
}
.player-loading{
    position:absolute;
    inset:0;
    z-index:3;
    display:grid;
    place-items:center;
    background:rgba(0,0,0,.35);
}
.player-loading .loader{margin:0}

@media(max-width:600px){
    .player-overlay{padding:12px}
    .player-box{
        width:100%;
        border-radius:10px;
    }
    .player-close{
        width:36px;
        height:36px;
        top:8px;
        right:8px;
    }
}

/* =========================
   LOADING / ERROR
========================= */
.loading{
    min-height:100vh;
    display:grid;
    place-items:center;
    color:#b9c5d4;
    font-size:14px;
}
.loader{
    width:28px;height:28px;
    border:2px solid rgba(255,255,255,.18);
    border-top-color:white;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:auto auto 13px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{
    width:min(560px,90%);
    text-align:center;
    padding:35px 25px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:18px;
    background:rgba(13,25,37,.8);
}
.error-box h2{font-size:21px;margin-bottom:8px}
.error-box p{color:#9ba9ba;font-size:13px;line-height:1.6}

/* =========================
   HIDDEN HELPERS
========================= */
.hidden{display:none!important}

/* =========================
   TABLET
========================= */
@media(max-width:900px){
    .content{
        width:min(94%,720px);
        padding-top:120px;
    }
    .backdrop{
        height:720px;
        min-height:560px;
    }
    .title{
        font-size:clamp(38px,8vw,62px);
        letter-spacing:.12em;
    }
    .info-grid{grid-template-columns:repeat(2,1fr)}
    .info-item:not(:nth-child(4n+1)){border-left:0}
    .info-item:nth-child(odd){border-right:1px solid rgba(255,255,255,.08)}
    .info-item:nth-child(even){border-left:0}
    .clip-card{aspect-ratio:16/7}
    .similar-row{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
}

/* =========================
   PHONE
========================= */
@media(max-width:600px){
    .header{
        height:62px;
        padding:0 18px;
    }
    .backdrop{
        top:62px;
    }
    .logo{font-size:20px}
    .logo-mark{width:27px;height:27px}
    .nav{display:none}
    .header-right{gap:5px}
    .header .search-box.open{
        position:absolute;
        top:58px;
        left:15px;
        right:15px;
        width:auto;
    }
    .profile{width:32px;height:32px}

    body{
        background:
            radial-gradient(circle at 50% 0%,rgba(27,66,99,.17),transparent 32%),
            #02070d;
    }
    /* Shorter cinematic thumbnail/backdrop on phones */
    .backdrop{
        top:62px;
        height:390px;
        min-height:0;
    }
    .backdrop img{
        object-position:center top;
        filter:brightness(.72) saturate(.92);
    }
    .backdrop::before{
        background:
            linear-gradient(180deg,rgba(0,0,0,.03),rgba(2,7,13,.15) 35%,rgba(2,7,13,.82) 71%,#02070d 100%);
    }

    .content{
        width:calc(100% - 28px);

<script>
/* =========================================================
   CINEFLIX MOVIE DETAILS
   Uses the same Supabase project as your homepage.
   Homepage currently stores movie poster as poster_url.
   ========================================================= */

const SUPABASE_URL = "https://bbqaagbypawcpszjwzii.supabase.co";
const SUPABASE_KEY = "sb_publishable_dWktR3La6JpSwD32tfSb-Q_a__jx0cO";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/*
   Optional TMDB API key.

   The page DOES NOT require this key when your Supabase row already
   contains poster_url / backdrop_url / tmdb_id.

   If your admin stores tmdb_id but does not store the TMDB images,
   put your TMDB API Read Access Token/API key here.
*/
const TMDB_API_KEY = ""; // Optional direct key. If empty, the saved admin Read Access Token is used.

function getTMDBToken(){
    const direct = String(window.CINEFLIX_TMDB_TOKEN || TMDB_API_KEY || "").trim();
    if(direct) return direct;
    try{
        return String(localStorage.getItem("cineflix_tmdb_token") || sessionStorage.getItem("cineflix_tmdb_token") || "").trim();
    }catch(e){
        try{return String(sessionStorage.getItem("cineflix_tmdb_token") || "").trim();}catch(_){return "";}
    }
}

/* Change only this if your watch/quality page has another filename. */
const WATCH_PAGE = "quality.html";

const params = new URLSearchParams(location.search);
const movieId = params.get("id");

const app = document.getElementById("app");

const esc = value => String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

const first = (...values) =>
    values.find(v => v !== undefined && v !== null && String(v).trim() !== "");

const arr = value => {
    if(Array.isArray(value)) return value;
    if(typeof value === "string"){
        try{
            const parsed = JSON.parse(value);
            if(Array.isArray(parsed)) return parsed;
        }catch(e){}
        return value.split(",").map(x=>x.trim()).filter(Boolean);
    }
    return [];
};

const val = (obj, keys, fallback="") => {
    for(const key of keys){
        if(obj && obj[key] !== undefined && obj[key] !== null && String(obj[key]).trim() !== ""){
            return obj[key];
        }
    }
    return fallback;
};

function imageFrom(value, fallback=""){
    if(!value) return fallback;
    if(typeof value === "object"){
        return first(value.url,value.src,value.file_path,value.path,fallback);
    }
    return String(value);
}

function tmdbImage(path,size="original"){
    if(!path) return "";
    if(/^https?:\/\//i.test(path)) return path;
    if(String(path).startsWith("//")) return "https:"+path;
    return `https://image.tmdb.org/t/p/${size}${String(path).startsWith("/") ? path : "/"+path}`;
}

function formatRuntime(runtime){
    if(runtime === undefined || runtime === null || runtime === "") return "";
    if(typeof runtime === "number"){
        const h = Math.floor(runtime/60);
        const m = runtime % 60;
        return h ? `${h}h ${m}m` : `${m}m`;
    }
    return String(runtime);
}

function getGenres(movie){
    const raw = first(movie.genres,movie.genre,movie.category,"");
    const list = arr(raw);

    return list.map(g=>{
        if(typeof g === "string") return g;
        return first(g.name,g.title,"");
    }).filter(Boolean);
}

function getPeople(movie){
    /*
      Important mobile fallback:
      TMDB is fetched live only when a TMDB token is available.
      Admin already stores TMDB cast_data / crew_data inside the
      Supabase movie row, so use those fields when live TMDB is not
      available. This makes Cast & Crew work on phones/other devices
      too, where localStorage from the admin device is not present.
    */
    const storedPeople = [];

    const addStored = raw => {
        if(!raw) return;

        if(Array.isArray(raw)){
            storedPeople.push(...raw);
            return;
        }

        if(typeof raw === "string"){
            try{
                const parsed = JSON.parse(raw);
                if(Array.isArray(parsed)){
                    storedPeople.push(...parsed);
                    return;
                }
                if(parsed && Array.isArray(parsed.cast)){
                    storedPeople.push(...parsed.cast);
                    return;
                }
                if(parsed && Array.isArray(parsed.credits)){
                    storedPeople.push(...parsed.credits);
                    return;
                }
                if(parsed && Array.isArray(parsed.crew)){
                    storedPeople.push(...parsed.crew);
                    return;
                }
            }catch(e){}

            const simple = raw.split(/[,\n|]+/).map(x=>x.trim()).filter(Boolean);
            if(simple.length) storedPeople.push(...simple);
            return;
        }

        if(typeof raw === "object"){
            if(Array.isArray(raw.cast)) storedPeople.push(...raw.cast);
            if(Array.isArray(raw.credits)) storedPeople.push(...raw.credits);
            if(Array.isArray(raw.crew)) storedPeople.push(...raw.crew);
        }
    };

    /* These are the fields produced by the CINEFLIX admin TMDB fetch. */
    addStored(movie.cast_data);
    addStored(movie.crew_data);

    if(storedPeople.length) return storedPeople;

    /* Older movie rows / manually entered cast fields. */
    const candidates = [
        movie.cast, movie.cast_crew, movie.credits,
        movie.actors, movie.cast_json, movie.crew
    ];

    for(const raw of candidates){
        if(!raw) continue;
        if(Array.isArray(raw)) return raw;

        if(typeof raw === "string"){
            try{
                const parsed = JSON.parse(raw);
                if(Array.isArray(parsed)) return parsed;
                if(parsed && Array.isArray(parsed.cast)) return parsed.cast;
                if(parsed && Array.isArray(parsed.credits)) return parsed.credits;
                if(parsed && Array.isArray(parsed.crew)) return parsed.crew;
            }catch(e){
                const simple = raw.split(/[,\n|]+/).map(x=>x.trim()).filter(Boolean);
                if(simple.length) return simple;
            }
        }

        if(typeof raw === "object"){
            if(Array.isArray(raw.cast)) return raw.cast;
            if(Array.isArray(raw.credits)) return raw.credits;
            if(Array.isArray(raw.crew)) return raw.crew;
        }
    }
    return [];
}

function getPoster(movie,tmdb){
    return first(
        imageFrom(movie.poster_url),
        imageFrom(movie.poster),
        imageFrom(movie.thumbnail),
        tmdbImage(tmdb?.poster_path,"w780"),
        "https://via.placeholder.com/780x1170/0b1420/ffffff?text=CINEFLIX"
    );
}

function getBackdrop(movie,tmdb){
    /*
      Priority:
      1) Supabase backdrop URL
      2) Supabase TMDB backdrop_path
      3) TMDB API backdrop_path
      4) poster as last fallback
    */
    return first(
        imageFrom(movie.backdrop_url),
        imageFrom(movie.backdrop),
        imageFrom(movie.backdrop_image),
        imageFrom(movie.hero_image),
        tmdbImage(first(
            movie.tmdb_backdrop_path,
            movie.tmdbBackdropPath,
            movie.backdrop_path
        ),"original"),
        tmdbImage(tmdb?.backdrop_path,"original"),
        getPoster(movie,tmdb)
    );
}

/* =========================================================
   TMDB
========================================================= */

async function fetchTMDB(movie){
    const token = getTMDBToken();
    if(!token) return null;

    const headers = {
        accept: "application/json",
        Authorization: `Bearer ${token}`
    };

    const explicitId = first(
        movie.tmdb_id, movie.tmdbId,
        movie.tmdb_movie_id, movie.tmdb_movieid
    );

    try{
        let movieIdToFetch = explicitId;

        if(!movieIdToFetch){
            const title = first(movie.title,movie.name,movie.original_title,movie.original_name);
            if(!title) return null;

            const year = first(
                movie.year,
                movie.release_year,
                String(movie.release_date || movie.first_air_date || "").slice(0,4)
            );

            const searchUrl = new URL("https://api.themoviedb.org/3/search/movie");
            searchUrl.searchParams.set("query",String(title));
            searchUrl.searchParams.set("language","en-US");
            searchUrl.searchParams.set("page","1");
            searchUrl.searchParams.set("include_adult","false");
            if(year) searchUrl.searchParams.set("year",String(year));

            const searchResponse = await fetch(searchUrl.toString(),{headers,cache:"no-store"});
            if(!searchResponse.ok) return null;

            const searchData = await searchResponse.json();
            const results = Array.isArray(searchData?.results) ? searchData.results : [];
            if(!results.length) return null;

            const wanted = String(title).trim().toLowerCase();
            const exact = results.find(item =>
                String(item?.title || item?.name || "").trim().toLowerCase() === wanted
            );
            movieIdToFetch = (exact || results[0])?.id;
            if(!movieIdToFetch) return null;
        }

        const detailUrl = new URL(
            `https://api.themoviedb.org/3/movie/${encodeURIComponent(movieIdToFetch)}`
        );
        detailUrl.searchParams.set("language","en-US");
        detailUrl.searchParams.set("append_to_response","credits,images,videos");
        detailUrl.searchParams.set("include_image_language","en,null");

        const response = await fetch(detailUrl.toString(),{headers,cache:"no-store"});
        if(!response.ok) return null;

        return await response.json();
    }catch(error){
        console.warn("CINEFLIX TMDB metadata unavailable:",error);
        return null;
    }
}

/* =========================================================
   INFO DATA
========================================================= */

function makeInfo(movie,tmdb){
    const release = first(
        movie.release_date,
        movie.releaseDate,
        movie.year ? String(movie.year) : "",
        tmdb?.release_date,
        ""
    );

    const type = String(first(movie.type,movie.category,tmdb ? "MOVIE" : "MOVIE")).toUpperCase();

    const genres = getGenres(movie);
    const tmdbGenres = (tmdb?.genres || []).map(x=>x.name).filter(Boolean);
    const category = genres.length ? genres.join(" / ") : (tmdbGenres.length ? tmdbGenres.join(" / ") : "Movie");

    const runtime = formatRuntime(first(
        movie.runtime,
        movie.duration,
        movie.duration_minutes,
        tmdb?.runtime,
        ""
    ));

    const language = first(
        movie.language,
        movie.languages,
        movie.lang,
        tmdb?.original_language,
        "EN"
    );

    const audio = first(
        movie.audio,
        movie.audio_language,
        movie.audio_languages,
        "Hindi 5.1 • English 5.1"
    );

    const quality = first(
        movie.quality,
        movie.qualities,
        movie.video_quality,
        "1080p • 720p • 480p"
    );

    const subtitles = first(
        movie.subtitles,
        movie.subtitle,
        movie.subtitle_languages,
        "Hindi • English"
    );

    return [
        ["Release Date",release,icons.calendar],
        ["Type",type,icons.globe],
        ["Category",category,icons.tag],
        ["Runtime",runtime,icons.clock],
        ["Language",String(language).toUpperCase(),icons.globe],
        ["Audio",audio,icons.audio],
        ["Quality",quality,icons.hd],
        ["Subtitles",subtitles,icons.subtitles]
    ];
}

/* =========================================================
   CAST
========================================================= */

function normalizeCast(movie,tmdb){
    /*
      TMDB is the primary source. Show the real cast first, followed by a
      useful selection of crew (Director/Writer/Producer/Cinematography/
      Editor/Music) so the section genuinely represents Cast & Crew.
    */
    if(tmdb?.credits){
        const cast = Array.isArray(tmdb.credits.cast)
            ? tmdb.credits.cast
                .filter(person=>person && person.name)
                .sort((a,b)=>(Number(a.order)||9999)-(Number(b.order)||9999))
                .slice(0,18)
                .map(person=>({
                    name:person.name,
                    role:person.character || "Cast",
                    photo:tmdbImage(person.profile_path,"w185")
                }))
            : [];

        const crewJobs = new Set([
            "Director","Writer","Screenplay","Producer",
            "Executive Producer","Cinematography","Director of Photography",
            "Editor","Original Music Composer","Music","Composer"
        ]);

        const crew = Array.isArray(tmdb.credits.crew)
            ? tmdb.credits.crew
                .filter(person=>person && person.name && crewJobs.has(person.job))
                .map(person=>({
                    name:person.name,
                    role:person.job || "Crew",
                    photo:tmdbImage(person.profile_path,"w185")
                }))
            : [];

        const people = [...cast,...crew];
        const seen = new Set();
        return people.filter(person=>{
            const key=String(person.name).toLowerCase();
            if(seen.has(key)) return false;
            seen.add(key);
            return true;
        }).slice(0,30);
    }

    /* Fallback to people saved in Supabase, if present. */
    const own = getPeople(movie);
    if(own.length){
        return own.slice(0,30).map(person=>{
            if(typeof person === "string") return {name:person,role:"Cast",photo:""};
            return {
                name:first(person.name,person.title,"Cast"),
                role:first(person.character,person.role,person.job,"Cast"),
                photo:first(
                    imageFrom(person.profile_url),
                    imageFrom(person.profile_path),
                    imageFrom(person.profile),
                    imageFrom(person.image),
                    imageFrom(person.photo),
                    tmdbImage(person.profile_path,"w185"),
                    tmdbImage(person.profile,"w185"),
                    ""
                )
            };
        });
    }
    return [];
}

/* =========================================================
   CLIPS
========================================================= */

function normalizeClips(movie,tmdb){
    let raw = first(
        movie.clips,
        movie.stills,
        movie.screenshots,
        movie.gallery,
        movie.images,
        []
    );

    let list = arr(raw);

    const clips = list.map(item=>{
        if(typeof item === "string") return {image:item,quote:""};
        return {
            image:first(
                imageFrom(item.image),
                imageFrom(item.url),
                imageFrom(item.src),
                tmdbImage(item.file_path,"original"),
                ""
            ),
            quote:first(item.quote,item.caption,item.text,"")
        };
    }).filter(x=>x.image);

    if(clips.length) return clips;

    if(tmdb?.backdrop_path){
        return [{
            image:tmdbImage(tmdb.backdrop_path,"original"),
            quote:""
        }];
    }

    return [{
        image:getPoster(movie,tmdb),
        quote:""
    }];
}

                <div class="header-right">
                    <div class="search-box" id="headerSearchBox">
                        <input type="text" id="headerSearchInput" placeholder="Search movies..." autocomplete="off">
                    </div>

                    <button class="icon-btn" id="headerSearchBtn" aria-label="Search">
                        <svg viewBox="0 0 24 24">
                            <circle cx="11" cy="11" r="7"/>
                            <path d="m20 20-4-4"/>
                        </svg>
                    </button>

                    <button class="icon-btn" id="headerNotificationBtn" aria-label="Notifications">
                        <svg viewBox="0 0 24 24">
                            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
                            <path d="M10 21h4"/>
                        </svg>
                    </button>

                    <div class="profile">S</div>
                </div>
            </header>

            <div class="player-overlay" id="playerOverlay" aria-hidden="true">
                <div class="player-box" id="playerBox">
                    <button class="player-close" id="playerClose" aria-label="Close player">
                        <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
                    </button>

                    <video class="player-video" id="playerVideo"
                           controls
                           playsinline
                           preload="metadata"></video>

                    <div class="player-loading hidden" id="playerLoading">
                        <div class="loader"></div>
                    </div>

                    <div class="player-empty hidden" id="playerEmpty"></div>
                </div>
            </div>

            <main class="content">

                <section class="movie-hero">
                    <h1 class="title">${esc(title)}</h1>

                    <div class="subtitle">
                        ${esc(first(movie.tagline, movie.director ? `${movie.director} FILM` : "A CINEFLIX MOVIE",""))}
                    </div>

                    <div class="meta">
                        <span class="imdb">IMDb</span>
                        <span class="rating">${rating ? Number(rating).toFixed(1) : "—"}</span>
                        ${year ? `<span class="dot">|</span><span>${esc(year)}</span>` : ""}
                        ${genreText ? `<span class="dot">•</span><span>${esc(genreText)}</span>` : ""}
                        ${runtime ? `<span class="dot">•</span><span>${esc(runtime)}</span>` : ""}
                    </div>

                    <p class="description">${esc(description)}</p>

                    <div class="actions">
                        <button class="action watch" id="watchBtn">
                            ${icons.play}
                            Watch Now
                        </button>
                        <button class="action share" id="shareBtn" aria-label="Share">
                            ${icons.share}
                        </button>
                    </div>
                </section>

                <section class="info-card">
                    <div class="info-head">
                        <h2 class="info-title">${icons.info} Movie Information</h2>
                        <button class="see-more" id="infoMore">
                            See More ${icons.chevron}
                        </button>
                    </div>

                    <div class="info-grid">
                        ${info.map(item=>`
                            <div class="info-item">
                                <div class="info-icon">${item[2]}</div>
                                <div>
                                    <div class="info-label">${esc(item[0])}</div>
                                    <div class="info-value">${esc(item[1] || "—")}</div>
                                </div>
                            </div>
                        `).join("")}
                    </div>
                </section>

                <section class="section">
                    <div class="section-head">
                        <h2 class="section-title">${icons.users} Cast & Crew</h2>
                        <div class="section-side">${cast.length ? "Swipe" : ""} ${icons.chevron}</div>
                    </div>

                    <div class="cast-row">
                        ${cast.length ? cast.map(person=>`
                            <div class="cast-person">
                                <div class="cast-photo">
                                    ${person.photo
                                        ? `<img src="${esc(person.photo)}" alt="${esc(person.name)}" loading="lazy" decoding="async">`
                                        : `<img src="${esc(poster)}" alt="${esc(person.name)}" loading="lazy" decoding="async">`
                                    }
                                </div>
                                <div class="cast-name">${esc(person.name)}</div>
                                <div class="cast-role">${esc(person.role || "Cast")}</div>
                            </div>
                        `).join("") : `
                            <div style="width:100%;padding:10px 0;color:#7f8ea0;font-size:11px;text-align:center;">
                                Cast data not available
                            </div>
                        `}
                    </div>
                </section>

                <section class="section">
                    <div class="section-head">
                        <h2 class="section-title">${icons.clips} Movie Clips</h2>
                        <div class="section-side">
                            <span id="clipCounter">1 / ${clips.length}</span>
                            <button class="circle-btn clip-mini-prev" aria-label="Previous clip">${icons.back}</button>
                            <button class="circle-btn clip-mini-next" aria-label="Next clip">${icons.chevron}</button>
                        </div>
                    </div>

                    <div class="clips-wrap">
                        <div class="clip-card">
                            <img id="clipImage" src="${esc(clips[0]?.image || poster)}" alt="${esc(title)}" loading="lazy" decoding="async">
                            <div class="clip-quote" id="clipQuote">${esc(clips[0]?.quote || "")}</div>

                            <button class="clip-arrow clip-prev" id="clipPrev" aria-label="Previous">
                                ${icons.back}
                            </button>
                            <button class="clip-arrow clip-next" id="clipNext" aria-label="Next">
                                ${icons.chevron}
                            </button>

                            <div class="clip-dots" id="clipDots">
                                ${clips.map((_,i)=>`<button class="clip-dot ${i===0?"active":""}" data-index="${i}"></button>`).join("")}
                            </div>
                        </div>
                    </div>
                </section>

                ${similar.length ? `
                <section class="section">
                    <div class="section-head">
                        <h2 class="section-title">${icons.clips} More Like This</h2>
                    </div>

                    <div class="similar-row">
                        ${similar.map(item=>{
                            const p = getPoster(item,null);
                            return `
                                <article class="poster-card" data-id="${esc(item.id)}">
                                    <img src="${esc(p)}" alt="${esc(item.title)}" loading="lazy" decoding="async">
                                    <div class="poster-gradient"></div>
                                    <div class="poster-name">${esc(item.title)}</div>
                                </article>
                            `;
                        }).join("")}
                    </div>
                </section>` : ""}

            </main>
        </div>
    `;

    initInteractions(movie,clips,similar);

    /* If a TMDB backdrop URL fails, gracefully fall back to the movie poster. */
    const backdropImg = document.getElementById("backdropImg");
    if(backdropImg){
        backdropImg.addEventListener("error",()=>{
            backdropImg.src = poster;
        },{once:true});
    }
}

/* =========================================================
   INTERACTIONS
========================================================= */

function initInteractions(movie,clips,similar){
    async function shareMovie(){
        const shareData = {
            title: document.title,
            text: `Watch ${first(movie.title,movie.name,"this movie")} on CINEFLIX`,
            url: location.href
        };

        try{
            if(navigator.share){
                await navigator.share(shareData);
            }else if(navigator.clipboard){
                await navigator.clipboard.writeText(location.href);
                alert("Movie link copied!");
            }else{
                prompt("Copy movie link:", location.href);
            }
        }catch(e){}
    }

    document.getElementById("shareBtn").onclick = shareMovie;

    const playerOverlay = document.getElementById("playerOverlay");
    const playerVideo = document.getElementById("playerVideo");
    const playerClose = document.getElementById("playerClose");
    const playerLoading = document.getElementById("playerLoading");
    const playerEmpty = document.getElementById("playerEmpty");

    function getVideoSource(movie){
        return first(
            movie.video_url,
            movie.videoUrl,
            movie.video,
            movie.source_code,
            movie.source_url,
            movie.stream_url,
            movie.streamUrl,
            movie.file_url,
            movie.download_url,
            movie.url
        );
    }

    function closePlayer(){
        playerOverlay.classList.remove("open");
        playerOverlay.setAttribute("aria-hidden","true");
        playerVideo.pause();
        playerVideo.removeAttribute("src");
        playerVideo.load();
        document.body.style.overflow="";
        playerLoading.classList.add("hidden");
        playerEmpty.classList.add("hidden");
    }

    function openPlayer(){
        const source=getVideoSource(movie);

        playerOverlay.classList.add("open");
        playerOverlay.setAttribute("aria-hidden","false");
        document.body.style.overflow="hidden";

        if(!source){
            playerEmpty.innerHTML=`
                <div>
                    <strong>Video source not available</strong>
                    This movie does not have a video URL saved yet.
                </div>`;
            playerEmpty.classList.remove("hidden");
            return;
        }

        playerEmpty.classList.add("hidden");
        playerLoading.classList.remove("hidden");

        playerVideo.src=source;
        playerVideo.load();

        const hideLoader=()=>playerLoading.classList.add("hidden");
        playerVideo.addEventListener("loadeddata",hideLoader,{once:true});
        playerVideo.addEventListener("canplay",hideLoader,{once:true});
        playerVideo.addEventListener("error",()=>{
            playerLoading.classList.add("hidden");
            playerEmpty.innerHTML=`
                <div>
                    <strong>Unable to play this video</strong>
                    The saved video source could not be loaded in this player.
                </div>`;
            playerEmpty.classList.remove("hidden");
        },{once:true});

        playerVideo.play().catch(()=>{});
    }

    document.getElementById("watchBtn").onclick=openPlayer;
    playerClose.onclick=closePlayer;

    playerOverlay.addEventListener("click",(e)=>{
        if(e.target===playerOverlay) closePlayer();
    });

    document.addEventListener("keydown",(e)=>{
        if(e.key==="Escape" && playerOverlay.classList.contains("open")){
            closePlayer();
        }
    });

    /* Same header behavior as index.html. */
    const header = document.getElementById("header");
    const searchBtn = document.getElementById("headerSearchBtn");
    const searchBox = document.getElementById("headerSearchBox");
    const searchInput = document.getElementById("headerSearchInput");

    searchBtn?.addEventListener("click",()=>{
        searchBox?.classList.toggle("open");
        if(searchBox?.classList.contains("open")){
            setTimeout(()=>searchInput?.focus(),120);
        }
    });

    searchInput?.addEventListener("keydown",(e)=>{
        if(e.key === "Enter"){
            const q = searchInput.value.trim();
            if(q) location.href = `index.html?search=${encodeURIComponent(q)}`;
        }
    });

    window.addEventListener("scroll",()=>{
        header?.classList.toggle("scrolled",window.scrollY > 40);
    },{passive:true});

    document.getElementById("infoMore").onclick = () => {
        document.querySelector(".info-card").scrollIntoView({
            behavior:"smooth",
            block:"center"
        });
    };

    /* Clips */
    let clipIndex = 0;

    const image = document.getElementById("clipImage");
    const quote = document.getElementById("clipQuote");
    const counter = document.getElementById("clipCounter");
    const dots = [...document.querySelectorAll(".clip-dot")];

    function showClip(index){
        if(!clips.length) return;

        if(index < 0) index = clips.length - 1;
        if(index >= clips.length) index = 0;

        clipIndex = index;

        image.style.opacity = "0";

        setTimeout(()=>{
            image.src = clips[index].image;
            quote.textContent = clips[index].quote || "";
            counter.textContent = `${index+1} / ${clips.length}`;
            dots.forEach((d,i)=>d.classList.toggle("active",i===index));
            image.style.opacity = "1";
        },100);
    }

    image.style.transition = ".25s";
    image.addEventListener("error",()=>{
        image.src = poster;
    });

    document.getElementById("clipPrev").onclick = () => showClip(clipIndex-1);
    document.getElementById("clipNext").onclick = () => showClip(clipIndex+1);

    document.querySelector(".clip-mini-prev").onclick = () => showClip(clipIndex-1);
    document.querySelector(".clip-mini-next").onclick = () => showClip(clipIndex+1);

    dots.forEach(dot=>{
        dot.onclick = () => showClip(Number(dot.dataset.index));
    });

    /* Cast slider: native touch swipe + desktop mouse drag. */
    const castRow = document.querySelector(".cast-row");
    if(castRow){
        let dragging = false;
        let startX = 0;
        let startScroll = 0;

        castRow.addEventListener("pointerdown",(e)=>{
            if(e.pointerType === "mouse"){
                dragging = true;
                startX = e.clientX;
                startScroll = castRow.scrollLeft;
                castRow.setPointerCapture?.(e.pointerId);
            }
        });

        castRow.addEventListener("pointermove",(e)=>{
            if(!dragging) return;
            castRow.scrollLeft = startScroll - (e.clientX - startX);
        });

        const stopCastDrag = ()=>{
            dragging = false;
        };
        castRow.addEventListener("pointerup",stopCastDrag);
        castRow.addEventListener("pointercancel",stopCastDrag);
        castRow.addEventListener("lostpointercapture",stopCastDrag);
    }

    /* Similar */
    document.querySelectorAll(".poster-card").forEach(card=>{
        card.onclick = () => {
            if(card.dataset.id){
                location.href = `movie.html?id=${encodeURIComponent(card.dataset.id)}`;
            }
        };
    });

    /* Keyboard clip navigation */
    document.addEventListener("keydown",e=>{
        if(e.key === "ArrowLeft") showClip(clipIndex-1);
        if(e.key === "ArrowRight") showClip(clipIndex+1);
    });
}

/* =========================================================
   LOAD
========================================================= */

async function loadMovie(){
    if(!movieId){
        showError("Movie ID missing","Open the details page from a movie card.");
        return;
    }

    try{
        const {data,error} = await supabaseClient
            .from("movies")
            .select("*")
            .eq("id",movieId)
            .single();

        if(error) throw error;
        if(!data) throw new Error("Movie not found");

        /* TMDB metadata is optional. Existing Supabase data always wins. */
        const tmdb = await fetchTMDB(data);

        /* Similar movies from the same database. */
        let similar = [];

        try{
            const {data:rows} = await supabaseClient
                .from("movies")
                .select("*")
                .neq("id",movieId)
                .order("created_at",{ascending:false})
                .limit(12);

            similar = Array.isArray(rows)
                ? rows.filter(x=>x && x.id && (x.poster_url || x.poster || x.thumbnail)).slice(0,12)
                : [];
        }catch(e){
            console.warn("Similar movies unavailable:",e);
        }

        render(data,tmdb,similar);

    }catch(error){
        console.error("CINEFLIX movie details error:",error);
        showError("Movie couldn't be loaded","Please check the movie ID and Supabase data.");
    }
}

function showError(title,text){
    app.innerHTML = `
        <div class="loading">
            <div class="error-box">
                <h2>${esc(title)}</h2>
                <p>${esc(text)}</p>
            </div>
        </div>
    `;
}

loadMovie();
</script>
</body>
</html>
