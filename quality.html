<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#07090d"
>

<title>CINEFLIX — Select Quality</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    min-height:100%;
    background:#07090d;
}

body{
    min-height:100vh;

    color:#f5f7fb;

    font-family:
        Inter,
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            900px 450px at 50% -160px,
            rgba(229,9,20,.15),
            transparent 70%
        ),
        radial-gradient(
            700px 500px at -10% 35%,
            rgba(62,82,255,.08),
            transparent 70%
        ),
        linear-gradient(
            180deg,
            #080a0f 0%,
            #06080c 100%
        );

    overflow-x:hidden;
}


/* =========================================================
   BACKGROUND DETAILS
========================================================= */

.bg-glow{
    position:fixed;

    width:380px;
    height:380px;

    right:-220px;
    bottom:-180px;

    border-radius:50%;

    background:
        rgba(229,9,20,.07);

    filter:blur(80px);

    pointer-events:none;

    z-index:0;
}


/* =========================================================
   HEADER
========================================================= */

.header{

    width:100%;

    position:relative;

    z-index:5;

    padding:
        18px clamp(16px,4vw,70px);

    display:flex;

    align-items:center;
    justify-content:space-between;

    border-bottom:
        1px solid rgba(255,255,255,.055);

    background:
        rgba(7,9,13,.62);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);
}

.logo{

    display:flex;

    align-items:center;

    gap:10px;

    color:#fff;

    text-decoration:none;

    font-size:
        clamp(18px,2vw,21px);

    font-weight:950;

    letter-spacing:-.7px;
}

.logo-box{

    width:32px;
    height:32px;

    display:flex;

    align-items:center;
    justify-content:center;

    flex:none;

    border-radius:10px;

    color:#fff;

    background:
        linear-gradient(
            145deg,
            #ff2635,
            #c7000c
        );

    font-size:12px;

    font-weight:950;

    box-shadow:
        0 8px 25px rgba(229,9,20,.20);
}

.header-right{

    display:flex;

    align-items:center;

    gap:9px;

    color:#626a76;

    font-size:9px;

    font-weight:800;

    letter-spacing:1.3px;

    text-transform:uppercase;
}

.online-dot{

    width:6px;
    height:6px;

    border-radius:50%;

    background:#44d581;

    box-shadow:
        0 0 10px rgba(68,213,129,.65);
}


/* =========================================================
   MAIN
========================================================= */

.main{

    position:relative;

    z-index:1;

    width:
        min(1060px, calc(100% - 32px));

    margin:
        0 auto;

    padding:
        clamp(28px,5vw,62px)
        0
        80px;
}


/* =========================================================
   HERO
========================================================= */

.hero{

    position:relative;

    overflow:hidden;

    padding:
        clamp(25px,4vw,43px);

    border:
        1px solid rgba(255,255,255,.075);

    border-radius:
        clamp(20px,3vw,30px);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.017)
        );

    box-shadow:
        0 35px 100px rgba(0,0,0,.28);
}

.hero::before{

    content:"";

    position:absolute;

    width:260px;
    height:260px;

    top:-150px;
    right:-80px;

    border-radius:50%;

    background:
        rgba(229,9,20,.08);

    filter:blur(35px);

    pointer-events:none;
}


/* =========================================================
   HERO TOP
========================================================= */

.hero-top{

    position:relative;
    z-index:1;

    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:20px;

    margin-bottom:
        clamp(22px,4vw,32px);
}

.step{

    display:flex;

    align-items:center;

    gap:9px;

    color:#747c88;

    font-size:9px;

    font-weight:900;

    letter-spacing:1.6px;

    text-transform:uppercase;
}

.step-number{

    width:30px;
    height:30px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:9px;

    color:#fff;

    background:
        rgba(229,9,20,.12);

    border:
        1px solid rgba(229,9,20,.22);

    font-size:9px;
}

.hero-tag{

    color:#525a66;

    font-size:8px;

    font-weight:850;

    letter-spacing:1.5px;

    text-transform:uppercase;
}


/* =========================================================
   MOVIE TITLE
========================================================= */

.movie-title{

    position:relative;

    z-index:1;

    max-width:900px;

    color:#fff;

    font-size:
        clamp(
            28px,
            5vw,
            52px
        );

    line-height:
        1.04;

    letter-spacing:
        clamp(-1.6px,-.1vw,-.7px);

    font-weight:950;

    overflow-wrap:anywhere;
}

.subtitle{

    position:relative;

    z-index:1;

    max-width:620px;

    margin-top:15px;

    color:#707884;

    font-size:
        clamp(11px,1.5vw,13px);

    line-height:1.65;
}


/* =========================================================
   DIVIDER
========================================================= */

.divider{

    height:1px;

    width:100%;

    margin:
        clamp(25px,4vw,34px)
        0
        22px;

    background:
        rgba(255,255,255,.06);
}


/* =========================================================
   SECTION HEADER
========================================================= */

.section-head{

    display:flex;

    align-items:flex-end;

    justify-content:space-between;

    gap:20px;

    margin-bottom:15px;
}

.section-title{

    color:#f0f2f5;

    font-size:
        clamp(13px,1.8vw,15px);

    font-weight:850;
}

.section-subtitle{

    margin-top:4px;

    color:#555e69;

    font-size:9px;
}

.quality-count{

    flex:none;

    color:#59616d;

    font-size:8px;

    font-weight:850;

    letter-spacing:1.2px;

    text-transform:uppercase;
}


/* =========================================================
   QUALITY GRID
========================================================= */

.quality-grid{

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:
        clamp(10px,1.5vw,14px);
}


/* =========================================================
   QUALITY CARD
========================================================= */

.quality-card{

    width:100%;

    min-height:
        clamp(135px,15vw,165px);

    padding:
        clamp(16px,2vw,21px);

    display:flex;

    flex-direction:column;

    justify-content:space-between;

    text-align:left;

    color:#fff;

    border:
        1px solid rgba(255,255,255,.075);

    border-radius:
        clamp(16px,2vw,21px);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.047),
            rgba(255,255,255,.013)
        );

    cursor:pointer;

    transition:
        transform .22s ease,
        border-color .22s ease,
        background .22s ease,
        box-shadow .22s ease;
}

.quality-card:hover{

    transform:
        translateY(-5px);

    border-color:
        rgba(229,9,20,.40);

    background:
        linear-gradient(
            145deg,
            rgba(229,9,20,.085),
            rgba(255,255,255,.018)
        );

    box-shadow:
        0 22px 55px rgba(0,0,0,.30);
}

.quality-card:active{

    transform:
        scale(.985);
}


/* =========================================================
   CARD TOP
========================================================= */

.card-top{

    width:100%;

    display:flex;

    align-items:center;

    justify-content:space-between;
}

.badge{

    min-width:45px;
    height:31px;

    padding:
        0 10px;

    display:inline-flex;

    align-items:center;
    justify-content:center;

    border-radius:9px;

    color:#fff;

    background:#11151d;

    border:
        1px solid rgba(255,255,255,.07);

    font-size:9px;

    font-weight:950;

    letter-spacing:.6px;
}

.card-arrow{

    width:31px;
    height:31px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:9px;

    color:#626a76;

    background:
        rgba(255,255,255,.035);

    font-size:14px;

    transition:.2s ease;
}

.quality-card:hover .card-arrow{

    color:#fff;

    background:#e50914;

    transform:
        translateX(2px);
}


/* =========================================================
   CARD TEXT
========================================================= */

.quality-name{

    display:block;

    margin-top:14px;

    color:#f1f3f6;

    font-size:
        clamp(13px,1.6vw,15px);

    font-weight:850;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.quality-meta{

    display:block;

    margin-top:5px;

    color:#59616c;

    font-size:9px;
}


/* =========================================================
   LOADING
========================================================= */

.loader{

    grid-column:
        1 / -1;

    min-height:210px;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    color:#68717c;

    font-size:11px;

    border:
        1px solid rgba(255,255,255,.06);

    border-radius:19px;

    background:
        rgba(255,255,255,.015);
}

.spinner{

    width:31px;
    height:31px;

    margin-bottom:13px;

    border:
        3px solid rgba(255,255,255,.07);

    border-top-color:#e50914;

    border-radius:50%;

    animation:
        spin .7s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}


/* =========================================================
   MESSAGE
========================================================= */

.message{

    grid-column:
        1 / -1;

    padding:
        40px 20px;

    text-align:center;

    color:#69717c;

    font-size:11px;

    border:
        1px solid rgba(255,255,255,.06);

    border-radius:18px;

    background:
        rgba(255,255,255,.015);
}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    margin-top:18px;

    text-align:center;

    color:#3f4650;

    font-size:8px;

    letter-spacing:.7px;
}


/* =========================================================
   TABLET
========================================================= */

@media (min-width:701px) and (max-width:900px){

    .main{

        width:
            min(760px, calc(100% - 42px));
    }

    .hero{

        padding:30px;
    }

}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media (max-width:700px){

    .header{

        padding:
            14px 4%;
    }

    .header-right{

        display:none;
    }

    .main{

        width:
            calc(100% - 24px);

        padding:
            22px 0 55px;
    }

    .hero{

        padding:
            22px 17px;

        border-radius:19px;
    }

    .hero-tag{

        display:none;
    }

    .hero-top{

        margin-bottom:22px;
    }

    .movie-title{

        font-size:
            clamp(28px,9vw,38px);
    }

    .subtitle{

        font-size:11px;

        margin-top:11px;
    }

    .quality-grid{

        grid-template-columns:1fr;

    }

    .quality-card{

        min-height:112px;

        padding:16px;

        border-radius:15px;
    }

}


/* =========================================================
   VERY SMALL PHONE
========================================================= */

@media (max-width:380px){

    .main{

        width:
            calc(100% - 18px);
    }

    .hero{

        padding:
            19px 14px;
    }

    .movie-title{

        font-size:26px;
    }

    .quality-card{

        min-height:105px;
    }

}


/* =========================================================
   LARGE DESKTOP
========================================================= */

@media (min-width:1400px){

    .main{

        width:1080px;

        padding-top:70px;
    }

    .quality-grid{

        grid-template-columns:
            repeat(3,minmax(0,1fr));
    }

}

</style>

</head>


<body>


<div class="bg-glow"></div>


<header class="header">

    <a
        href="/zozomovie.github.io"
        class="logo"
    >

        <span class="logo-box">
            C
        </span>

        CINEFLIX

    </a>


    <div class="header-right">

        <span class="online-dot"></span>

        Download Center

    </div>

</header>



<main class="main">


    <section class="hero">


        <div class="hero-top">

            <div class="step">

                <span class="step-number">
                    01
                </span>

                SELECT QUALITY

            </div>


            <div class="hero-tag">
                CINEFLIX
            </div>

        </div>


        <h1
            class="movie-title"
            id="movieTitle"
        >
            Select Movie Quality
        </h1>


        <p class="subtitle">

            Choose the quality that suits your
            device and connection. Your available
            download servers will appear next.

        </p>


        <div class="divider"></div>


        <div class="section-head">

            <div>

                <div class="section-title">
                    Available Qualities
                </div>

                <div class="section-subtitle">
                    Select one option to continue
                </div>

            </div>


            <div
                class="quality-count"
                id="qualityCount"
            >
                —
            </div>

        </div>


        <div
            class="quality-grid"
            id="qualityContainer"
        >

            <div class="loader">

                <div class="spinner"></div>

                Loading qualities...

            </div>

        </div>


    </section>


    <div class="footer">
        CINEFLIX • Premium Download Experience
    </div>


</main>



<script>


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://bbqaagbypawcpszjwzii.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_dWktR3La6JpSwD32tfSb-Q_a__jx0cO";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   URL
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


let movieId =
    params.get("id") ||
    sessionStorage.getItem(
        "active_movie_id"
    );


if(movieId){

    sessionStorage.setItem(
        "active_movie_id",
        movieId
    );

    sessionStorage.setItem(
        "last_active_page",
        "quality"
    );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

    return String(value || "")
        .replace(
            /[&<>"']/g,
            function(char){

                return {

                    "&":"&amp;",
                    "<":"&lt;",
                    ">":"&gt;",
                    '"':"&quot;",
                    "'":"&#039;"

                }[char];

            }
        );

}


/* =========================================================
   BADGE
========================================================= */

function getBadge(name){

    const value =
        String(name || "")
            .toUpperCase();


    if(
        value.includes("2160") ||
        value.includes("4K")
    ){

        return "4K";

    }


    if(
        value.includes("1080")
    ){

        return "FHD";

    }


    if(
        value.includes("720")
    ){

        return "HD";

    }


    if(
        value.includes("480")
    ){

        return "SD";

    }


    return "HD";

}


/* =========================================================
   LOAD
========================================================= */

async function loadQualities(){

    const container =
        document.getElementById(
            "qualityContainer"
        );

    const title =
        document.getElementById(
            "movieTitle"
        );

    const count =
        document.getElementById(
            "qualityCount"
        );


    if(!movieId){

        container.innerHTML = `
            <div class="message">
                Movie ID missing.
            </div>
        `;

        return;
    }


    try{

        const {
            data,
            error
        } = await supabaseClient

            .from("movies")

            .select(
                "title, qualities_data"
            )

            .eq(
                "id",
                movieId
            )

            .single();


        if(
            error ||
            !data
        ){

            throw new Error(
                "Movie not found."
            );

        }


        const movieTitle =
            data.title ||
            "Download Movie";


        title.textContent =
            movieTitle;


        const qualities =
            Array.isArray(
                data.qualities_data
            )
                ? data.qualities_data
                : [];


        count.textContent =
            qualities.length +
            (
                qualities.length === 1
                    ? " OPTION"
                    : " OPTIONS"
            );


        if(!qualities.length){

            container.innerHTML = `
                <div class="message">
                    No qualities available for this movie.
                </div>
            `;

            return;
        }


        container.innerHTML =
            qualities.map(
                (quality,index) => {

                    const name =
                        quality.quality_name ||
                        "Available Quality";


                    return `

                        <button
                            type="button"
                            class="quality-card"
                            data-index="${index}"
                        >

                            <span class="card-top">

                                <span class="badge">
                                    ${escapeHtml(
                                        getBadge(name)
                                    )}
                                </span>

                                <span class="card-arrow">
                                    →
                                </span>

                            </span>


                            <span>

                                <span class="quality-name">
                                    ${escapeHtml(name)}
                                </span>

                                <span class="quality-meta">
                                    High quality download
                                </span>

                            </span>

                        </button>

                    `;

                }
            )
            .join("");


        document
            .querySelectorAll(
                ".quality-card"
            )
            .forEach(card => {

                card.addEventListener(
                    "click",
                    function(){

                        const index =
                            Number(
                                this.dataset.index
                            );


                        goToServer(
                            index,
                            movieTitle,
                            qualities[index]?.quality_name ||
                            "HD Quality"
                        );

                    }
                );

            });


    }
    catch(error){

        console.error(error);


        container.innerHTML = `
            <div class="message">
                Unable to load qualities.
            </div>
        `;

    }

}


/* =========================================================
   RANDOM
========================================================= */

function generateRandomString(
    length=13
){

    const chars =
        "abcdefghijklmnopqrstuvwxyz0123456789";

    let result = "";


    for(
        let i=0;
        i<length;
        i++
    ){

        result +=
            chars.charAt(
                Math.floor(
                    Math.random() *
                    chars.length
                )
            );

    }


    return result;

}


/* =========================================================
   SERVER
========================================================= */

function goToServer(
    qIndex,
    title,
    qualityName
){

    const ref =
        generateRandomString(13);


    sessionStorage.setItem(
        "active_movie_id",
        movieId
    );

    sessionStorage.setItem(
        "active_q_index",
        qIndex
    );

    sessionStorage.setItem(
        "active_movie_title",
        title
    );

    sessionStorage.setItem(
        "active_quality_name",
        qualityName
    );

    sessionStorage.setItem(
        "active_server_ref",
        ref
    );

    sessionStorage.setItem(
        "last_active_page",
        "server"
    );


    /*
    IMPORTANT:

    ID + quality index + title + quality
    are present in URL.

    Therefore server page does NOT depend
    on sessionStorage authorization.
    */

    window.location.href =
        "/server.html" +
        "?id=" +
        encodeURIComponent(movieId) +
        "&q_index=" +
        encodeURIComponent(qIndex) +
        "&ref=" +
        encodeURIComponent(ref) +
        "&title=" +
        encodeURIComponent(title) +
        "&quality=" +
        encodeURIComponent(qualityName);

}


/* =========================================================
   START
========================================================= */

loadQualities();

</script>

</body>
</html>
