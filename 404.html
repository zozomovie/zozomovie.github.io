<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CINEFLIX - Redirecting...</title>
<script>
(function handleAccessAndRedirect() {
    const path = window.location.pathname;
    const search = window.location.search;
    const activeMovieId = sessionStorage.getItem("active_movie_id");
    const lastPage = sessionStorage.getItem("last_active_page");

    // 1. Server Page Refresh / Route Restore
    if ((path.includes('/server.html/') || path.match(/\/[a-z0-9]+_h$/i) || lastPage === "server") && activeMovieId) {
        window.location.replace("/server.html" + search);
        return;
    }

    // 2. Quality Page Refresh / Route Restore
    if ((path.includes('/download/') || lastPage === "quality") && activeMovieId) {
        window.location.replace("/quality.html" + search);
        return;
    }

    // 3. Movie / Series Page Refresh / Route Restore (Handles /movie/title/id.html or /series/title/id.html)
    if (path.match(/\/(movie|series)\/.+\/[a-z0-9]+\.html$/i) || lastPage === "movie") {
        window.location.replace("/movie.html" + search);
        return;
    }

    // 4. Default Fallback for truly invalid/direct links without session
    window.location.replace("/zozomovie.github.io");
})();
</script>
<style>
body {
    background: #050505;
    color: #fff;
    font-family: Inter, sans-serif;
    display: grid;
    place-items: center;
    min-height: 100vh;
    margin: 0;
}
.spinner {
    width: 34px;
    height: 34px;
    border: 3px solid rgba(255,255,255,.1);
    border-top-color: #e50914;
    border-radius: 50%;
    animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div style="text-align: center;">
    <div class="spinner"></div>
</div>
</body>
</html>
