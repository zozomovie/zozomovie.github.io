<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CINEFLIX — Select Quality</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}
html{
    min-height:100%;
    background:#050505;
}
body{
    min-height:100vh;
    color:#fff;
    font-family:Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
        radial-gradient(ellipse 90% 42% at 50% -12%, rgba(229,9,20,.17), transparent 65%),
        linear-gradient(180deg, #080808 0%, #050505 100%);
}
.navbar{
    width:100%;
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 clamp(16px,5vw,60px);
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(5,5,5,.84);
    border-bottom:1px solid rgba(255,255,255,.055);
    backdrop-filter:blur(18px);
}
.logo{
    color:#e50914;
    text-decoration:none;
    font-size:25px;
    font-weight:900;
    letter-spacing:-1.2px;
}
.page{
    width:min(620px,92%);
    margin:0 auto;
    padding:30px 0 70px;
    text-align:center;
}
.movie-title{
    margin:0 auto 7px;
    color:#fff;
    font-size:clamp(22px,5vw,32px);
    font-weight:800;
    line-height:1.2;
}
.subtitle{
    margin-bottom:25px;
    color:#777;
    font-size:12px;
}
.quality-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}
.quality-button{
    width:100%;
    min-height:64px;
    display:flex;
    align-items:center;
    padding:0 16px;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.085);
    border-radius:15px;
    background:linear-gradient(135deg, rgba(255,255,255,.052), rgba(255,255,255,.018));
    transition:transform .18s ease, border-color .2s ease, background .2s ease;
    cursor:pointer;
}
.quality-button:hover{
    transform:translateY(-2px);
    border-color:rgba(229,9,20,.43);
    background:linear-gradient(135deg, rgba(229,9,20,.10), rgba(255,255,255,.025));
}
.quality-name{
    flex:1;
    text-align:left;
    font-size:15px;
    font-weight:700;
}
.loader-box{
    padding:40px 0;
    color:#8a8a8a;
    font-size:13px;
}
.spinner{
    width:32px;
    height:32px;
    margin:0 auto 12px;
    border:3px solid rgba(255,255,255,.1);
    border-top-color:#e50914;
    border-radius:50%;
    animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<nav class="navbar">
    <a href="zozomovie.github.io" class="logo">CINEFLIX</a>
</nav>

<main class="page">
    <h1 class="movie-title" id="movieTitle">Select Movie Quality</h1>
    <p class="subtitle">Choose your preferred download quality</p>

    <div class="quality-list" id="qualityContainer">
        <div class="loader-box">
            <div class="spinner"></div>
            Loading available qualities...
        </div>
    </div>
</main>

<script>
const params = new URLSearchParams(window.location.search);
let movieId = params.get("id") || sessionStorage.getItem("active_movie_id");

if (movieId) {
    sessionStorage.setItem("active_movie_id", movieId);
    sessionStorage.setItem("last_active_page", "quality");
    const rawTitle = params.get("movie") || params.get("title") || sessionStorage.getItem("active_movie_slug") || "download";
    sessionStorage.setItem("active_movie_slug", rawTitle);
}

(function protectAndMaskQualityPage() {
    if (!movieId) {
        alert("Direct URL access prohibited!");
        window.location.href = "zozomovie.github.io";
        return;
    }

    const hasAccess = sessionStorage.getItem(`access_quality_${movieId}`) || sessionStorage.getItem(`auth_movie_${movieId}`);

    if (!hasAccess) {
        alert("Direct URL access prohibited!");
        window.location.href = "zozomovie.github.io";
        return;
    }

    const rawTitle = sessionStorage.getItem("active_movie_slug") || "download";
    const movieSlug = rawTitle.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
    
    if (window.history.pushState && movieSlug) {
        const customUrl = window.location.protocol + "//" + window.location.host + '/download/' + movieSlug;
        window.history.pushState({ path: customUrl }, '', customUrl);
    }
})();

function generateRandomString(length = 13) {
    const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
    let res = '';
    for (let i = 0; i < length; i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
    return res;
}

function navigateToServer(qIndex, title, qualityName) {
    const random13 = generateRandomString(13);
    
    sessionStorage.setItem(`access_server_${movieId}_${qIndex}`, 'granted');
    sessionStorage.setItem(`auth_server_${movieId}_${qIndex}`, 'true');
    sessionStorage.setItem("active_server_ref", random13);
    sessionStorage.setItem("active_q_index", qIndex);
    sessionStorage.setItem("active_movie_title", title);
    sessionStorage.setItem("active_quality_name", qualityName);
    sessionStorage.setItem("last_active_page", "server");

    window.location.href = `/server.html?ref=${random13}&id=${movieId}&q_index=${qIndex}&title=${encodeURIComponent(title)}&quality=${encodeURIComponent(qualityName)}`;
}

const SUPABASE_URL = "https://bbqaagbypawcpszjwzii.supabase.co";
const SUPABASE_KEY = "sb_publishable_dWktR3La6JpSwD32tfSb-Q_a__jx0cO";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadQualities() {
    const container = document.getElementById("qualityContainer");
    if (!movieId) {
        container.innerHTML = `<div class="loader-box">Movie ID missing.</div>`;
        return;
    }

    try {
        const { data, error } = await supabaseClient
            .from("movies")
            .select("title, qualities_data")
            .eq("id", movieId)
            .single();

        if (error || !data) throw new Error("Movie not found.");

        const mTitle = data.title || "Download Movie";
        document.getElementById("movieTitle").textContent = mTitle;
        const qualities = data.qualities_data || [];

        if (qualities.length === 0) {
            container.innerHTML = `<div class="loader-box">No qualities available for this movie.</div>`;
            return;
        }

        container.innerHTML = qualities.map((q, idx) => {
            const escapedTitle = mTitle.replace(/'/g, "\\'");
            const escapedQuality = q.quality_name.replace(/'/g, "\\'");
            return `
                <div class="quality-button" onclick="navigateToServer(${idx}, '${escapedTitle}', '${escapedQuality}')">
                    <span class="quality-name">${q.quality_name}</span>
                    <span>➔</span>
                </div>
            `;
        }).join("");

    } catch (err) {
        container.innerHTML = `<div class="loader-box">Error: ${err.message}</div>`;
    }
}

loadQualities();
</script>

</body>
</html>
