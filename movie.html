<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#020a11">
<title>CINEFLIX — Movie</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#020a11;
  --bg2:#06121b;
  --text:#f5f7fb;
  --muted:#aab5c5;
  --muted2:#758296;
  --line:rgba(190,215,240,.13);
  --glass:rgba(9,24,37,.72);
  --white:#fff;
  --accent:#e9f1ff;
}

*{margin:0;padding:0;box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  min-height:100vh;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 50% -10%,#193247 0,#07151f 34%,#020a11 72%);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}

button,a{font:inherit}
button{border:0}
a{text-decoration:none;color:inherit}

/* =========================
   PAGE
========================= */
.page{
  width:min(100%,1280px);
  margin:auto;
  padding-bottom:70px;
}

/* =========================
   HERO
========================= */
.hero{
  position:relative;
  min-height:720px;
  display:flex;
  align-items:flex-end;
  overflow:hidden;
}

.hero-backdrop{
  position:absolute;
  inset:0 0 70px;
  background:#07111a center top/cover no-repeat;
  transform:scale(1.015);
}

.hero-backdrop::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(to bottom,
      rgba(1,7,12,.04) 0%,
      rgba(1,7,12,.05) 32%,
      rgba(2,10,17,.34) 57%,
      rgba(2,10,17,.93) 88%,
      #020a11 100%);
}

.hero-backdrop::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,rgba(2,9,15,.35),transparent 52%,rgba(2,9,15,.12));
  z-index:1;
}

.hero-actions-top{
  position:absolute;
  z-index:5;
  top:28px;
  left:30px;
  right:30px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.circle-btn{
  width:56px;
  height:56px;
  border-radius:50%;
  display:grid;
  place-items:center;
  color:#fff;
  background:rgba(5,10,16,.58);
  border:1px solid rgba(255,255,255,.25);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  cursor:pointer;
  pointer-events:auto;
  transition:.2s ease;
}

.circle-btn:hover{
  background:rgba(20,31,43,.82);
  transform:scale(1.04);
}

.circle-btn svg{
  width:28px;
  height:28px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.hero-content{
  position:relative;
  z-index:3;
  width:100%;
  padding:0 38px 42px;
}

.movie-title{
  max-width:780px;
  font-size:64px;
  line-height:.98;
  font-weight:900;
  letter-spacing:-2.8px;
  text-shadow:0 5px 25px rgba(0,0,0,.35);
  margin-bottom:17px;
}

.movie-meta{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:11px;
  color:#d6deeb;
  font-size:16px;
  font-weight:500;
  margin-bottom:18px;
}

.movie-meta .dot{color:#78879b}
.movie-meta .rating{color:#ffe066;font-weight:700}

.imdb{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:27px;
  min-width:51px;
  padding:0 7px;
  border-radius:5px;
  background:#f5c518;
  color:#111;
  font-size:16px;
  font-weight:900;
  letter-spacing:-1px;
}

.movie-meta .age{
  border:1px solid rgba(255,255,255,.42);
  border-radius:4px;
  padding:3px 6px;
  color:#eef3fa;
  font-size:12px;
  font-weight:700;
}

.movie-description{
  max-width:790px;
  color:#d1d9e5;
  font-size:16px;
  line-height:1.75;
  margin-bottom:22px;
  text-wrap:balance;
}

.hero-buttons{
  display:flex;
  align-items:center;
  gap:14px;
}

.primary-btn,
.secondary-btn{
  min-height:58px;
  border-radius:30px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:0 28px;
  cursor:pointer;
  transition:.2s ease;
  font-size:16px;
  font-weight:800;
}

.primary-btn{
  min-width:258px;
  color:#081018;
  background:#fff;
}

.primary-btn:hover{transform:translateY(-2px);background:#f0f4f8}

.secondary-btn{
  min-width:245px;
  color:#f1f5fa;
  background:rgba(9,24,37,.68);
  border:1px solid rgba(190,215,240,.17);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.secondary-btn:hover{
  transform:translateY(-2px);
  background:rgba(20,39,55,.85);
}

.hero-buttons .share{
  min-width:58px;
  width:58px;
  padding:0;
}

.hero-buttons svg{
  width:24px;
  height:24px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.primary-btn svg{fill:currentColor;stroke:none}

/* =========================
   CONTENT
========================= */
.content{
  padding:0 38px;
}

.section{
  margin-top:28px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

.section-title{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:22px;
  line-height:1.2;
  font-weight:800;
  letter-spacing:-.5px;
}

.section-title svg{
  width:27px;
  height:27px;
  fill:none;
  stroke:#edf4ff;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.section-link{
  display:flex;
  align-items:center;
  gap:5px;
  color:#c8d2e1;
  font-size:14px;
  font-weight:500;
}

.section-link svg{
  width:17px;
  height:17px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
}

/* =========================
   CAST
========================= */
.cast-row{
  display:flex;
  gap:22px;
  overflow-x:auto;
  padding:3px 1px 13px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}

.cast-row::-webkit-scrollbar{display:none}

.cast{
  flex:0 0 112px;
  text-align:center;
}

.cast-photo{
  width:94px;
  height:94px;
  margin:0 auto 10px;
  border-radius:50%;
  overflow:hidden;
  border:2px solid rgba(203,224,246,.26);
  background:linear-gradient(135deg,#263949,#0d1720);
  box-shadow:0 8px 25px rgba(0,0,0,.28);
}

.cast:first-child .cast-photo{
  border-color:#83c9ff;
  box-shadow:0 0 0 1px rgba(131,201,255,.18),0 8px 25px rgba(0,0,0,.3);
}

.cast-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.cast-placeholder{
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  color:#91a0b0;
}

.cast-placeholder svg{
  width:37px;
  height:37px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.4;
}

.cast-name{
  min-height:38px;
  color:#f3f5f8;
  font-size:13px;
  line-height:1.35;
  font-weight:700;
}

.cast-role{
  margin-top:4px;
  color:#7e8a9c;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* =========================
   DOWNLOAD
========================= */
.download-section{
  margin-top:12px;
}

.download-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  padding:18px 20px;
  border:1px solid var(--line);
  border-radius:18px;
  background:
    linear-gradient(110deg,rgba(18,37,53,.82),rgba(6,18,28,.76));
  box-shadow:0 18px 55px rgba(0,0,0,.16);
}

.download-copy{
  min-width:0;
}

.download-title{
  font-size:17px;
  font-weight:800;
  margin-bottom:5px;
}

.download-sub{
  color:#8593a5;
  font-size:12px;
}

.download-button{
  flex:0 0 auto;
  min-height:48px;
  padding:0 23px;
  border-radius:13px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  color:#071019;
  background:#fff;
  font-size:14px;
  font-weight:800;
  transition:.2s ease;
}

.download-button:hover{
  transform:translateY(-2px);
  background:#eef4fa;
}

.download-button svg{
  width:19px;
  height:19px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* =========================
   SIMILAR GRID
========================= */
.similar-section{
  margin-top:34px;
}

.similar-grid{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:15px;
}

.similar-card{
  position:relative;
  min-width:0;
  aspect-ratio:2/3;
  overflow:hidden;
  border-radius:12px;
  background:#0c1821;
  border:1px solid rgba(190,215,240,.11);
  box-shadow:0 10px 28px rgba(0,0,0,.2);
  cursor:pointer;
  isolation:isolate;
  transition:transform .2s ease,border-color .2s ease;
}

.similar-card:hover{
  transform:translateY(-4px);
  border-color:rgba(213,232,250,.3);
}

.similar-poster{
  position:absolute;
  inset:0;
  background:#15232e center/cover no-repeat;
}

.similar-poster::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,transparent 42%,rgba(0,0,0,.9) 100%);
}

.similar-info{
  position:absolute;
  z-index:2;
  left:11px;
  right:11px;
  bottom:11px;
}

.similar-title{
  color:#fff;
  font-size:12px;
  line-height:1.25;
  font-weight:800;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.similar-meta{
  margin-top:5px;
  color:#b8c2cf;
  font-size:9px;
  font-weight:600;
}

/* =========================
   LOADING / ERROR
========================= */
.loading{
  min-height:100vh;
  display:grid;
  place-items:center;
  color:#8c9bad;
  font-size:14px;
}

.error{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:30px;
  text-align:center;
  color:#b9c4d2;
}

.error strong{
  display:block;
  color:#fff;
  margin-bottom:7px;
  font-size:18px;
}

/* =========================
   TABLET
========================= */
@media (max-width:1000px){
  .page{width:100%}
  .hero{min-height:650px}
  .hero-backdrop{inset:0 0 55px}
  .movie-title{font-size:52px}
  .content,.hero-content{padding-left:28px;padding-right:28px}
  .similar-grid{grid-template-columns:repeat(5,minmax(0,1fr))}
}

/* =========================
   MOBILE
========================= */
@media (max-width:700px){
  body{
    background:
      radial-gradient(circle at 50% -5%,#142938 0,#06121b 35%,#020a11 75%);
  }

  .page{padding-bottom:45px}

  .hero{
    min-height:650px;
    align-items:flex-end;
  }

  .hero-backdrop{
    inset:0 0 20px;
    background-position:center top;
  }

  .hero-backdrop::after{
    background:
      linear-gradient(to bottom,
        rgba(1,7,12,.02) 0%,
        rgba(1,7,12,.08) 33%,
        rgba(2,10,17,.38) 54%,
        rgba(2,10,17,.94) 82%,
        #020a11 100%);
  }

  .hero-actions-top{
    top:16px;
    left:16px;
    right:16px;
  }

  .circle-btn{
    width:48px;
    height:48px;
  }

  .circle-btn svg{
    width:24px;
    height:24px;
  }

  .hero-content{
    padding:0 17px 27px;
  }

  .movie-title{
    max-width:100%;
    font-size:36px;
    letter-spacing:-1.6px;
    line-height:1;
    margin-bottom:13px;
  }

  .movie-meta{
    gap:7px;
    font-size:12px;
    margin-bottom:13px;
  }

  .imdb{
    height:24px;
    min-width:44px;
    font-size:13px;
    border-radius:4px;
  }

  .movie-meta .age{
    padding:2px 5px;
    font-size:9px;
  }

  .movie-description{
    max-width:100%;
    font-size:12px;
    line-height:1.65;
    margin-bottom:17px;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .hero-buttons{
    gap:8px;
    width:100%;
  }

  .primary-btn,
  .secondary-btn{
    min-height:49px;
    border-radius:25px;
    padding:0 15px;
    font-size:12px;
    gap:8px;
  }

  .primary-btn{
    min-width:0;
    flex:1.35;
  }

  .secondary-btn{
    min-width:0;
    flex:1;
  }

  .hero-buttons .share{
    width:49px;
    min-width:49px;
    flex:0 0 49px;
  }

  .hero-buttons svg{
    width:19px;
    height:19px;
  }

  .content{
    padding:0 17px;
  }

  .section{
    margin-top:24px;
  }

  .section-head{
    margin-bottom:12px;
  }

  .section-title{
    gap:9px;
    font-size:18px;
  }

  .section-title svg{
    width:23px;
    height:23px;
  }

  .section-link{
    font-size:11px;
  }

  .cast-row{
    gap:13px;
    padding-bottom:8px;
  }

  .cast{
    flex-basis:82px;
  }

  .cast-photo{
    width:66px;
    height:66px;
    margin-bottom:8px;
  }

  .cast-name{
    min-height:31px;
    font-size:10px;
  }

  .cast-role{
    font-size:8px;
    margin-top:2px;
  }

  .download-section{
    margin-top:21px;
  }

  .download-card{
    padding:14px;
    border-radius:14px;
    gap:12px;
  }

  .download-title{
    font-size:13px;
    margin-bottom:4px;
  }

  .download-sub{
    font-size:9px;
  }

  .download-button{
    min-height:42px;
    padding:0 14px;
    border-radius:10px;
    font-size:11px;
    gap:6px;
  }

  .download-button svg{
    width:16px;
    height:16px;
  }

  .similar-section{
    margin-top:28px;
  }

  .similar-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:11px;
  }

  .similar-card{
    border-radius:9px;
  }

  .similar-info{
    left:9px;
    right:9px;
    bottom:9px;
  }

  .similar-title{
    font-size:10px;
  }

  .similar-meta{
    font-size:8px;
    margin-top:4px;
  }
}

/* Very small phones */
@media (max-width:380px){
  .movie-title{font-size:32px}
  .movie-description{font-size:11px}
  .primary-btn,.secondary-btn{font-size:11px;padding:0 11px}
  .cast{flex-basis:76px}
  .cast-photo{width:61px;height:61px}
}

/* Reduced motion */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important}
}
</style>
</head>

<body>

<div id="app" class="loading">Loading movie…</div>

<script>
(() => {
  const SUPABASE_URL = "https://bbqaagbypawcpszjwzii.supabase.co";
  const SUPABASE_KEY = "sb_publishable_dWktR3La6JpSwD32tfSb-Q_a__jx0cO";

  const app = document.getElementById("app");

  const esc = (value) => String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[ch]));

  const arr = value => Array.isArray(value) ? value : [];

  const yearOf = movie =>
    movie.year || String(movie.release_date || "").slice(0,4) || "";

  const runtimeOf = minutes => {
    const n = Number(minutes || 0);
    if (!n) return "";
    const h = Math.floor(n / 60);
    const m = n % 60;
    return h ? `${h}h ${m}m` : `${m}m`;
  };

  const movieId = new URLSearchParams(location.search).get("id");

  function placeholderPerson(){
    return `
      <div class="cast-placeholder">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 21a8 8 0 0 1 16 0"></path>
        </svg>
      </div>`;
  }

  function similarCard(item){
    const poster = item.poster || item.poster_url || item.backdrop_url || "";
    const title = item.title || item.name || "Movie";
    const year = item.year || String(item.release_date || "").slice(0,4);
    const rating = Number(item.rating || 0);

    return `
      <a class="similar-card"
         href="movie.html?id=${encodeURIComponent(item.tmdb_id || item.id || "")}">
        <div class="similar-poster"
             style="${poster ? `background-image:url("${esc(poster)}")` : ""}">
        </div>
        <div class="similar-info">
          <div class="similar-title">${esc(title)}</div>
          <div class="similar-meta">
            ${esc(year || "")}${rating ? ` • ★ ${rating.toFixed(1)}` : ""}
          </div>
        </div>
      </a>`;
  }

  function render(movie){
    const title = movie.title || movie.original_title || "Movie";
    const year = yearOf(movie);
    const runtime = runtimeOf(movie.runtime);
    const rating = Number(movie.rating || 0);
    const genres = arr(movie.genres);
    const cast = arr(movie.cast_data);
    const crew = arr(movie.crew_data);
    const similar = arr(movie.similar_data);

    const backdrop = movie.backdrop_url || movie.poster_url || "";
    const downloadUrl =
      movie.download_url ||
      movie.video_1080 ||
      movie.video_720 ||
      movie.video_480 ||
      "";

    const people = [...cast, ...crew].slice(0,10);

    document.title = `${title} — CINEFLIX`;

    app.className = "";
    app.innerHTML = `
      <main class="page">

        <section class="hero">
          <div class="hero-backdrop"
               ${backdrop ? `style="background-image:url('${esc(backdrop)}')"` : ""}>
          </div>

          <div class="hero-actions-top">
            <button class="circle-btn" id="backBtn" aria-label="Go back">
              <svg viewBox="0 0 24 24">
                <path d="M19 12H5"></path>
                <path d="m12 19-7-7 7-7"></path>
              </svg>
            </button>

            <button class="circle-btn" id="heartBtn" aria-label="Add to watchlist">
              <svg viewBox="0 0 24 24">
                <path d="M20.8 8.7c0 5.5-8.8 10.2-8.8 10.2S3.2 14.2 3.2 8.7A4.7 4.7 0 0 1 12 6.2a4.7 4.7 0 0 1 8.8 2.5z"></path>
              </svg>
            </button>
          </div>

          <div class="hero-content">
            <h1 class="movie-title">${esc(title)}</h1>

            <div class="movie-meta">
              <span class="imdb">IMDb</span>
              <span class="rating">${rating ? rating.toFixed(1) : "—"}</span>
              ${year ? `<span class="dot">•</span><span>${esc(year)}</span>` : ""}
              ${genres.slice(0,3).map(g => `<span class="dot">•</span><span>${esc(g)}</span>`).join("")}
              ${runtime ? `<span class="dot">•</span><span>${esc(runtime)}</span>` : ""}
            </div>

            <p class="movie-description">
              ${esc(movie.overview || movie.tagline || "No description available for this movie.")}
            </p>

            <div class="hero-buttons">
              ${downloadUrl ? `
                <a class="primary-btn" href="${esc(downloadUrl)}" target="_blank" rel="noopener">
                  <svg viewBox="0 0 24 24">
                    <path d="M8.2 5.6v12.8c0 .8.9 1.3 1.6.9l9.1-6.4c.6-.4.6-1.3 0-1.8L9.8 4.7c-.7-.5-1.6.1-1.6.9Z"></path>
                  </svg>
                  Watch Now
                </a>` : `
                <button class="primary-btn" type="button" disabled style="opacity:.6">
                  <svg viewBox="0 0 24 24">
                    <path d="M8.2 5.6v12.8c0 .8.9 1.3 1.6.9l9.1-6.4c.6-.4.6-1.3 0-1.8L9.8 4.7c-.7-.5-1.6.1-1.6.9Z"></path>
                  </svg>
                  Watch Now
                </button>`}

              <button class="secondary-btn" id="watchlistBtn" type="button">
                <svg viewBox="0 0 24 24">
                  <path d="M12 5v14"></path>
                  <path d="M5 12h14"></path>
                </svg>
                Add to Watchlist
              </button>

              <button class="secondary-btn share" id="shareBtn" type="button" aria-label="Share movie">
                <svg viewBox="0 0 24 24">
                  <circle cx="18" cy="5" r="2"></circle>
                  <circle cx="6" cy="12" r="2"></circle>
                  <circle cx="18" cy="19" r="2"></circle>
                  <path d="m8 11 8-5"></path>
                  <path d="m8 13 8 5"></path>
                </svg>
              </button>
            </div>
          </div>
        </section>

        <section class="content">

          <section class="section cast-section">
            <div class="section-head">
              <h2 class="section-title">
                <svg viewBox="0 0 24 24">
                  <circle cx="9" cy="8" r="3"></circle>
                  <circle cx="17" cy="9" r="2.5"></circle>
                  <path d="M3.5 20c.4-4 2.3-6 5.5-6s5.1 2 5.5 6"></path>
                  <path d="M14.5 15c3.1-.7 5.3 1.1 6 4"></path>
                </svg>
                Cast &amp; Crew
              </h2>
              <span class="section-link">View All
                <svg viewBox="0 0 24 24">
                  <path d="m9 18 6-6-6-6"></path>
                </svg>
              </span>
            </div>

            <div class="cast-row">
              ${people.length ? people.map(person => `
                <div class="cast">
                  <div class="cast-photo">
                    ${person.profile
                      ? `<img src="${esc(person.profile)}" alt="${esc(person.name || "Cast")}" loading="lazy">`
                      : placeholderPerson()}
                  </div>
                  <div class="cast-name">${esc(person.name || "Unknown")}</div>
                  <div class="cast-role">${esc(person.character || person.job || "")}</div>
                </div>
              `).join("") : `
                <div class="cast">
                  <div class="cast-photo">${placeholderPerson()}</div>
                  <div class="cast-name">No cast data</div>
                  <div class="cast-role"></div>
                </div>
              `}
            </div>
          </section>

          <section class="section download-section">
            <div class="section-head">
              <h2 class="section-title">
                <svg viewBox="0 0 24 24">
                  <path d="M12 3v12"></path>
                  <path d="m7 10 5 5 5-5"></path>
                  <path d="M4 20h16"></path>
                </svg>
                Download
              </h2>
            </div>

            <div class="download-card">
              <div class="download-copy">
                <div class="download-title">${esc(title)}</div>
                <div class="download-sub">
                  ${movie.video_1080 ? "1080p available" : movie.video_720 ? "720p available" : movie.video_480 ? "480p available" : "Download link not available"}
                </div>
              </div>

              ${downloadUrl
                ? `<a class="download-button" href="${esc(downloadUrl)}" target="_blank" rel="noopener" download>
                     <svg viewBox="0 0 24 24">
                       <path d="M12 3v12"></path>
                       <path d="m7 10 5 5 5-5"></path>
                       <path d="M4 20h16"></path>
                     </svg>
                     Download
                   </a>`
                : `<span class="download-button" style="opacity:.45;pointer-events:none">
                     <svg viewBox="0 0 24 24">
                       <path d="M12 3v12"></path>
                       <path d="m7 10 5 5 5-5"></path>
                       <path d="M4 20h16"></path>
                     </svg>
                     No Link
                   </span>`}
            </div>
          </section>

          <section class="section similar-section">
            <div class="section-head">
              <h2 class="section-title">
                <svg viewBox="0 0 24 24">
                  <rect x="3" y="4" width="7" height="7" rx="1"></rect>
                  <rect x="14" y="4" width="7" height="7" rx="1"></rect>
                  <rect x="3" y="15" width="7" height="7" rx="1"></rect>
                  <rect x="14" y="15" width="7" height="7" rx="1"></rect>
                </svg>
                Similar Movies
              </h2>
              <span class="section-link">View All
                <svg viewBox="0 0 24 24">
                  <path d="m9 18 6-6-6-6"></path>
                </svg>
              </span>
            </div>

            <div class="similar-grid">
              ${similar.length
                ? similar.slice(0,12).map(similarCard).join("")
                : `<div style="grid-column:1/-1;color:#748295;font-size:13px;padding:15px 0">No similar movies available.</div>`}
            </div>
          </section>

        </section>
      </main>
    `;

    document.getElementById("backBtn")?.addEventListener("click", () => {
      if (history.length > 1) history.back();
      else location.href = "index.html";
    });

    const heart = document.getElementById("heartBtn");
    const watchlist = document.getElementById("watchlistBtn");

    function toggleWatchlist(){
      const key = "cineflix_watchlist_v1";
      let list = [];
      try { list = JSON.parse(localStorage.getItem(key) || "[]"); } catch(e){}
      if (!Array.isArray(list)) list = [];

      const id = String(movie.id || movie.tmdb_id || title);
      const exists = list.some(x => String(x.id) === id);

      if (exists) {
        list = list.filter(x => String(x.id) !== id);
      } else {
        list.unshift({
          id: movie.id || movie.tmdb_id || title,
          title,
          poster: movie.poster_url || movie.backdrop_url || "",
          year
        });
        list = list.slice(0,50);
      }

      try { localStorage.setItem(key, JSON.stringify(list)); } catch(e){}

      const active = !exists;
      if (heart) {
        heart.style.color = active ? "#ff6370" : "#fff";
        heart.querySelector("svg").style.fill = active ? "currentColor" : "none";
      }
      if (watchlist) {
        watchlist.innerHTML = active
          ? `<svg viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"></path></svg> Added to Watchlist`
          : `<svg viewBox="0 0 24 24"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg> Add to Watchlist`;
      }
    }

    heart?.addEventListener("click", toggleWatchlist);
    watchlist?.addEventListener("click", toggleWatchlist);

    document.getElementById("shareBtn")?.addEventListener("click", async () => {
      try {
        if (navigator.share) {
          await navigator.share({
            title: `${title} — CINEFLIX`,
            text: `Watch ${title} on CINEFLIX.`,
            url: location.href
          });
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(location.href);
        }
      } catch(e){}
    });
  }

  async function load(){
    if (!movieId) {
      app.className = "error";
      app.innerHTML = `<div><strong>Movie ID missing</strong>Open this page as movie.html?id=YOUR_MOVIE_ID</div>`;
      return;
    }

    try{
      if (!window.supabase){
        await new Promise((resolve,reject) => {
          const s = document.createElement("script");
          s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
          s.onload = resolve;
          s.onerror = () => reject(new Error("Supabase library failed to load."));
          document.head.appendChild(s);
        });
      }

      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      const {data,error} = await client
        .from("movies")
        .select("*")
        .eq("id", movieId)
        .maybeSingle();

      if (error) throw error;
      if (!data) throw new Error("This movie was not found in Supabase.");

      render(data);
    }catch(error){
      console.error(error);
      app.className = "error";
      app.innerHTML = `
        <div>
          <strong>Movie could not be loaded</strong>
          ${esc(error.message || "Unknown error")}
        </div>`;
    }
  }

  load();
})();
</script>
</body>
</html>
