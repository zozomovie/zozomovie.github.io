<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CINEFLIX - Loading...</title>
<script>
(function restoreRoute() {
    const path = window.location.pathname;
    const search = window.location.search;

    // Direct access to masked quality URL -> restore quality.html
    if (path.includes('/download/')) {
        const urlParams = new URLSearchParams(search);
        const movieId = urlParams.get('id');
        if (movieId) {
            window.location.replace(`/quality.html${search}`);
            return;
        }
    }

    // Direct access to masked server URL -> restore server.html
    if (path.match(/\/[a-z0-9]+_h$/i)) {
        const urlParams = new URLSearchParams(search);
        const movieId = urlParams.get('id');
        if (movieId) {
            window.location.replace(`/server.html${search}`);
            return;
        }
    }

    // Default Fallback
    window.location.replace("/zozomovie.github.io");
})();
</script>
<style>
body {
    background: #050505;
    color: #fff;
    font-family: sans-serif;
    display: grid;
    place-items: center;
    min-height: 100vh;
    margin: 0;
}
.spinner {
    width: 32px;
    height: 32px;
    border: 3px solid rgba(255,255,255,.1);
    border-top-color: #e50914;
    border-radius: 50%;
    animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div style="text-align: center;">
    <div class="spinner"></div>
</div>
</body>
</html>
