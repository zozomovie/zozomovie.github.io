<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#02070d">
<link rel="icon" href="data:,">
<title>CINEFLIX — Movie Details</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
    --red:#e50914;
    --bg:#02070d;
    --panel:rgba(12,25,38,.72);
    --panel2:rgba(13,28,43,.9);
    --text:#f7f9ff;
    --muted:#9ca9bb;
    --line:rgba(255,255,255,.11);
    --blue:#dce9ff;
    --accent:#ffffff;
    --gold:#ffd33d;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
    min-height:100vh;
    overflow-x:hidden;
    background:
        radial-gradient(circle at 50% 0%,rgba(27,66,99,.22),transparent 40%),
        #02070d;
    color:var(--text);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
}
button{font:inherit}
button,a{tap-highlight-color:transparent;-webkit-tap-highlight-color:transparent}

.page{
    position:relative;
    min-height:100vh;
}

/* =========================
   BACKDROP
========================= */
.backdrop{
    position:absolute;
    z-index:0;
    top:72px;
    left:0;
    width:100%;
    height:min(748px,78vw);
    min-height:590px;
    overflow:hidden;
    pointer-events:none;
}
.backdrop img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 25%;
    filter:saturate(.95) brightness(.82);
    transform:scale(1.015);
}
.backdrop::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:1;
    background:
        linear-gradient(90deg,
            rgba(1,6,11,.16) 0%,
            rgba(1,6,11,.03) 48%,
            rgba(1,6,11,.20) 100%),
        linear-gradient(180deg,
            rgba(2,7,13,.18) 0%,
            rgba(2,7,13,.03) 7%,
            rgba(2,7,13,.10) 46%,
            rgba(2,7,13,.80) 78%,
            #02070d 100%);
}
.backdrop::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:2;
    background:
        radial-gradient(ellipse at 50% 25%,transparent 15%,rgba(1,5,9,.26) 100%);
}

/* =========================
   HEADER
========================= */
.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:64px;
    z-index:1000;
    display:flex;
    align-items:center;
    padding:0 4%;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,.92),
        rgba(0,0,0,.58),
        transparent
    );
    transition:.35s;
}
.header.scrolled{
    background:rgba(5,5,6,.96);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}
.logo{
    font-size:24px;
    font-weight:900;
    letter-spacing:-1.5px;
    color:#fff;
    text-decoration:none;
    display:flex;
    align-items:center;
    gap:8px;
    white-space:nowrap;
}
.logo-mark{
    width:30px;
    height:30px;
    border-radius:8px;
    background:var(--red);
    display:grid;
    place-items:center;
    box-shadow:0 5px 20px rgba(229,9,20,.35);
}
.logo-mark svg{width:17px;height:17px;fill:#fff}
.nav{
    display:flex;
    align-items:center;
    gap:27px;
    margin-left:45px;
}
.nav a{
    color:#d5d5d7;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    transition:.2s;
}
.nav a:hover,.nav a.active{color:#fff}
.nav a.active{position:relative}
.nav a.active::after{
    content:"";
    position:absolute;
    bottom:-8px;
    left:50%;
    width:5px;
    height:5px;
    background:var(--red);
    border-radius:50%;
    transform:translateX(-50%);
}
.header-right{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:18px;

    position:relative;
    z-index:1002;
}
.header .search-box{
    position:relative;
    width:0;
    opacity:0;
    overflow:visible;
    transition:width .28s ease,opacity .2s ease;
}
.header .search-box.open{width:315px;opacity:1}
.header .search-box input{
    width:100%;
    height:40px;
    border:1px solid rgba(255,255,255,.18);
    background:linear-gradient(135deg,rgba(18,28,39,.97),rgba(5,12,18,.97));
    color:#fff;
    outline:none;
    border-radius:12px;
    padding:0 50px 0 14px;
    font-size:13px;
    box-shadow:0 10px 35px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.04);
}
.header .search-box input:focus{
    border-color:rgba(255,255,255,.34);
    box-shadow:0 10px 35px rgba(0,0,0,.32),0 0 0 3px rgba(229,9,20,.10);
}
.header .search-submit{
    position:absolute;
    right:5px;
    top:5px;
    width:30px;
    height:30px;
    border:0;
    border-radius:9px;
    background:linear-gradient(135deg,#e50914,#ff3340);
    color:#fff;
    display:grid;
    place-items:center;
    cursor:pointer;
    box-shadow:0 5px 16px rgba(229,9,20,.24);
}
.header .search-submit svg{
    width:16px;
    height:16px;
    stroke:currentColor;
    fill:none;
    stroke-width:2;
}
/* Desktop: keep the real search field visible in the header. */
@media(min-width:601px){
    .header .search-box{
        width:315px;
        opacity:1;
    }
    #headerSearchBtn{
        display:none;
    }
}

@media(min-width:601px) and (max-width:1050px){
    .header .search-box{width:250px;}
    .header-right{gap:10px;}
}

.header .search-suggestions{
    position:absolute;
    top:48px;
    left:0;
    width:100%;
    max-height:390px;
    overflow-y:auto;
    padding:6px;
    border:1px solid rgba(255,255,255,.11);
    border-radius:14px;
    background:rgba(7,16,24,.98);
    backdrop-filter:blur(18px);
    box-shadow:0 18px 45px rgba(0,0,0,.5);
    display:none;
    z-index:1200;
}
.header .search-suggestions.show{display:block}
.header .search-suggestion{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    padding:7px;
    border:0;
    border-radius:10px;
    background:transparent;
    color:#fff;
    text-align:left;
    cursor:pointer;
}
.header .search-suggestion:hover{background:rgba(255,255,255,.08)}
.header .search-suggestion img{
    width:38px;
    height:54px;
    flex:0 0 38px;
    object-fit:cover;
    border-radius:6px;
}
.header .search-suggestion-info{min-width:0}
.header .search-suggestion-title{
    display:block;
    font-size:12px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
.header .search-suggestion-meta{
    display:block;
    margin-top:4px;
    color:#8f9aaa;
    font-size:10px;
}
.icon-btn{
    position:relative;
    z-index:1003;
    cursor:pointer;
    pointer-events:auto;
    width:38px;
    height:38px;
    border:0;
    background:transparent;
    color:#fff;
    display:grid;
    place-items:center;
    cursor:pointer;
    border-radius:50%;
    transition:.2s;
}
.icon-btn:hover{background:rgba(255,255,255,.1)}
.icon-btn svg{
    width:20px;
    height:20px;
    stroke:currentColor;
    fill:none;
    stroke-width:1.9;
}
.profile{
    width:35px;
    height:35px;
    border-radius:50%;
    background:linear-gradient(135deg,#ff1f35,#6f0710);
    display:grid;
    place-items:center;
    font-size:12px;
    font-weight:800;
}

/* =========================
   TOP CONTROLS
========================= */
.topbar{
    position:relative;
    z-index:20;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:28px 3.1%;
}
.circle-btn{
    width:56px;
    height:56px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.16);
    background:rgba(4,8,13,.48);
    color:white;
    display:grid;
    place-items:center;
    cursor:pointer;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    transition:.22s;
}
.circle-btn:hover{
    background:rgba(255,255,255,.13);
    transform:translateY(-1px);
}
.circle-btn svg{
    width:28px;
    height:28px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
}

/* =========================
   MAIN
========================= */
.content{
    position:relative;
    z-index:5;
    width:min(1160px,94%);
    margin:0 auto;
    padding-top:125px;
    padding-bottom:65px;
}

/* =========================
   HERO DETAILS
========================= */
.movie-hero{
    max-width:780px;
}
.title{
    font-size:clamp(46px,6.5vw,78px);
    line-height:.92;
    font-weight:900;
    letter-spacing:.17em;
    text-transform:uppercase;
    text-shadow:0 5px 30px rgba(0,0,0,.6);
    margin-bottom:9px;
}
.subtitle{
    font-size:clamp(10px,1.15vw,15px);
    font-weight:700;
    letter-spacing:.52em;
    color:#d8e0eb;
    margin-bottom:22px;
}
.meta{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:9px;
    color:#dbe2ec;
    font-size:15px;
    line-height:1.6;
    margin-bottom:22px;
}
.meta .dot{opacity:.6}
.imdb{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:56px;
    height:29px;
    padding:0 8px;
    border-radius:6px;
    background:#f4c51d;
    color:#0b0b0b;
    font-size:17px;
    font-weight:900;
    letter-spacing:-1.2px;
}
.rating{
    color:#e4eaf4;
    font-weight:500;
}
.description{
    max-width:700px;
    color:#c6d0dd;
    font-size:16px;
    line-height:1.75;
    margin-bottom:26px;
}
.actions{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:20px;
}
.action{
    height:64px;
    border-radius:34px;
    border:1px solid rgba(255,255,255,.12);
    padding:0 30px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    cursor:pointer;
    font-size:16px;
    font-weight:800;
    transition:.22s;
}
.watch{
    min-width:260px;
    background:#fff;
    color:#080c12;
    box-shadow:0 14px 34px rgba(0,0,0,.22);
}
.watch:hover{transform:translateY(-2px);background:#e9edf2}
.watch svg{width:22px;height:22px;fill:currentColor}
.watch.loading{opacity:.7;pointer-events:none}
.list{
    min-width:245px;
    background:rgba(10,23,36,.76);
    color:white;
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
}
.list:hover{background:rgba(26,46,65,.9)}
.list svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9}
.share{
    width:64px;
    padding:0;
    background:rgba(10,23,36,.76);
    color:white;
    backdrop-filter:blur(15px);
}
.share:hover{background:rgba(26,46,65,.9)}
.share svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9}

/* =========================
   INFORMATION CARD
========================= */
.info-card{
    width:100%;
    overflow:hidden;
    border:1px solid rgba(164,191,220,.14);
    border-radius:21px;
    background:
        linear-gradient(135deg,rgba(22,40,58,.78),rgba(7,20,31,.76));
    box-shadow:0 20px 55px rgba(0,0,0,.22);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
}
.info-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 26px 13px;
}
.info-title{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:20px;
    font-weight:800;
}
.info-title svg{
    width:29px;
    height:29px;
    fill:#dce8f9;
}
.see-more{
    display:flex;
    align-items:center;
    gap:7px;
    color:#c4cfdd;
    background:none;
    border:0;
    cursor:pointer;
    font-size:14px;
}
.see-more svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2}

.info-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
}
.info-item{
    min-height:68px;
    padding:9px 16px 9px 20px;
    display:grid;
    grid-template-columns:34px 1fr;
    gap:13px;
    align-items:start;
    border-top:1px solid rgba(255,255,255,.08);
}
.info-item:not(:nth-child(4n+1)){
    border-left:1px solid rgba(255,255,255,.08);
}
.info-icon{
    width:29px;
    height:29px;
    color:#dce7f7;
}
.info-icon svg{
    width:100%;
    height:100%;
    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
}
.info-label{
    color:#aab7c8;
    font-size:13px;
    margin-bottom:3px;
}
.info-value{
    color:#e4eaf2;
    font-size:13px;
    line-height:1.45;
}

/* =========================
   SECTION
========================= */
.section{
    margin-top:20px;
}
.section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:0 10px 13px;
}
.section-title{
    display:flex;
    align-items:center;
    gap:13px;
    font-size:20px;
    font-weight:800;
}
.section-title svg{
    width:28px;
    height:28px;
    fill:#f2f6ff;
}
.section-side{
    color:#c6cfdd;
    font-size:13px;
    display:flex;
    align-items:center;
    gap:8px;
}
.section-side svg{
    width:16px;height:16px;
    fill:none;stroke:currentColor;stroke-width:2;
}

/* =========================
   TMDB BACKDROP CLIPS — RESPONSIVE CAROUSEL
========================= */
.clips-wrap{
    position:relative;
    width:100%;
    overflow:hidden;
    border-radius:20px;
    touch-action:pan-y;
}
.clip-track{
    display:flex;
    gap:14px;
    width:100%;
    transform:translate3d(0,0,0);
    transition:transform .48s cubic-bezier(.22,.61,.36,1);
    will-change:transform;
}
.clip-slide{
    position:relative;
    flex:0 0 calc((100% - 28px) / 2.5);
    aspect-ratio:16/8.5;
    min-height:240px;
    overflow:hidden;
    border-radius:17px;
    border:1px solid rgba(255,255,255,.11);
    background:#09131e;
    box-shadow:0 12px 32px rgba(0,0,0,.25);
    scroll-snap-align:start;
}
.clip-slide::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(180deg,transparent 48%,rgba(0,0,0,.58) 100%),
        linear-gradient(90deg,rgba(0,0,0,.08),transparent 55%,rgba(0,0,0,.18));
}
.clip-slide img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    transition:transform .6s ease,filter .35s ease;
    filter:brightness(.9) saturate(.98);
}
.clip-slide:hover img{transform:scale(1.025);filter:brightness(.96) saturate(1.02)}
.clip-quote{
    position:absolute;
    z-index:2;
    left:18px;
    right:18px;
    bottom:15px;
    color:#fff;
    font-size:12px;
    line-height:1.35;
    font-weight:600;
    text-shadow:0 2px 10px rgba(0,0,0,.7);
}
.clip-dots{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:7px;
    margin-top:10px;
    min-height:7px;
}
.clip-dot{
    width:7px;
    height:7px;
    padding:0;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.28);
    cursor:pointer;
    transition:width .25s ease,background .25s ease,transform .25s ease;
}
.clip-dot.active{
    width:22px;
    border-radius:10px;
    background:#fff;
}
.clip-arrow{
    position:absolute;
    z-index:6;
    top:50%;
    transform:translateY(-50%);
    width:46px;
    height:46px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(8,13,19,.62);
    color:#fff;
    display:grid;
    place-items:center;
    cursor:pointer;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    box-shadow:0 8px 22px rgba(0,0,0,.3);
    transition:.2s ease;
}
.clip-arrow:hover{background:rgba(255,255,255,.17);transform:translateY(-50%) scale(1.04)}
.clip-arrow:active{transform:translateY(-50%) scale(.95)}
.clip-arrow svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2}
.clip-prev{left:9px}.clip-next{right:9px}
@media(max-width:900px){
    .clip-slide{flex:0 0 100%;width:100%;aspect-ratio:16/8.8;min-height:210px;border-radius:15px}
    .clip-track{gap:12px}
}
@media(max-width:600px){
    .header-right{position:static;}
    .header .search-box{
        position:absolute;
        top:62px;
        left:15px;
        right:15px;
        width:auto;
        opacity:0;
        visibility:hidden;
        transform:translateY(-8px) scale(.985);
        transform-origin:top center;
        pointer-events:none;
        transition:opacity .18s ease,transform .22s ease,visibility .22s ease;
    }
    .header .search-box.open{
        width:auto;
        opacity:1;
        visibility:visible;
        transform:translateY(0) scale(1);
        pointer-events:auto;
    }
    .header .search-box input{
        height:44px;
        border-radius:13px;
        font-size:13px;
        padding-left:14px;
        padding-right:52px;
    }
    .header .search-submit{
        width:34px;
        height:34px;
        top:5px;
        right:5px;
        border-radius:10px;
    }
}

@media(max-width:600px){
    .clips-wrap{width:100%;min-height:0}
    .clip-track{width:100%;gap:0}
    .clip-slide{flex:0 0 100%;width:100%;min-width:100%;min-height:0;height:176px;aspect-ratio:auto}
    .clip-slide img{object-fit:cover}
    .clip-dots{margin-top:9px}
}

/* =========================
   CAST
========================= */
.cast-row{
    display:flex;
    gap:24px;
    overflow-x:auto;
    overflow-y:hidden;
    padding:7px 8px 12px;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
    scroll-snap-type:x proximity;
    overscroll-behavior-x:contain;
    touch-action:pan-x;
    cursor:grab;
}
.cast-row:active{cursor:grabbing}
.cast-row::-webkit-scrollbar{display:none}
.cast-person{
    scroll-snap-align:start;
}
.cast-person{
    flex:0 0 102px;
    text-align:center;
    scroll-snap-align:start;
}
.cast-photo{
    width:88px;
    height:88px;
    margin:0 auto 11px;
    border-radius:50%;
    overflow:hidden;
    border:2px solid rgba(255,255,255,.16);
    background:#15212d;
    box-shadow:0 7px 25px rgba(0,0,0,.3);
}
.cast-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}
.cast-name{
    font-size:13px;
    line-height:1.25;
    font-weight:800;
}
.cast-role{
    margin-top:5px;
    color:#8897aa;
    font-size:12px;
    line-height:1.25;
}

/* =========================
   DOWNLOAD NOW
========================= */
.download-now-wrap{
    width:100%;
    margin:8px 0 2px;
}
.download-now-btn{
    width:100%;
    min-height:62px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding:0 22px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:16px;
    text-decoration:none;
    color:#fff;
    background:linear-gradient(135deg,#ff1744 0%,#e5092f 48%,#b90025 100%);
    box-shadow:0 12px 32px rgba(229,9,47,.24),inset 0 1px 0 rgba(255,255,255,.18);
    font-size:17px;
    font-weight:900;
    letter-spacing:.02em;
    transition:transform .2s ease,box-shadow .2s ease,filter .2s ease;
    cursor:pointer;
}
.download-now-btn:hover{
    transform:translateY(-2px);
    filter:brightness(1.06);
    box-shadow:0 16px 38px rgba(229,9,47,.32),inset 0 1px 0 rgba(255,255,255,.2);
}
.download-now-btn:active{transform:translateY(0) scale(.99)}
.download-now-btn svg{
    width:23px;
    height:23px;
    fill:none;
    stroke:currentColor;
    stroke-width:2.1;
    stroke-linecap:round;

    if(Array.isArray(value)) return value;
    if(typeof value === "string"){
        try{
            const parsed = JSON.parse(value);
            if(Array.isArray(parsed)) return parsed;
        }catch(e){}
        return value.split(",").map(x=>x.trim()).filter(Boolean);
    }
    return [];
};

const val = (obj, keys, fallback="") => {
    for(const key of keys){
        if(obj && obj[key] !== undefined && obj[key] !== null && String(obj[key]).trim() !== ""){
            return obj[key];
        }
    }
    return fallback;
};

function imageFrom(value, fallback=""){
    if(!value) return fallback;
    if(typeof value === "object"){
        return first(value.url,value.src,value.file_path,value.path,fallback);
    }
    return String(value);
}

function tmdbImage(path,size="original"){
    if(!path) return "";
    if(/^https?:\/\//i.test(path)) return path;
    if(String(path).startsWith("//")) return "https:"+path;
    return `https://image.tmdb.org/t/p/${size}${String(path).startsWith("/") ? path : "/"+path}`;
}

function formatRuntime(runtime){
    if(runtime === undefined || runtime === null || runtime === "") return "";
    if(typeof runtime === "number"){
        const h = Math.floor(runtime/60);
        const m = runtime % 60;
        return h ? `${h}h ${m}m` : `${m}m`;
    }
    return String(runtime);
}

function getGenres(movie){
    const raw = first(movie.genres,movie.genre,movie.category,"");
    const list = arr(raw);

    return list.map(g=>{
        if(typeof g === "string") return g;
        return first(g.name,g.title,"");
    }).filter(Boolean);
}

function getPeople(movie){
    const storedPeople = [];

    const addStored = raw => {
        if(!raw) return;

        if(Array.isArray(raw)){
            storedPeople.push(...raw);
            return;
        }

        if(typeof raw === "string"){
            try{
                const parsed = JSON.parse(raw);
                if(Array.isArray(parsed)){
                    storedPeople.push(...parsed);
                    return;
                }
                if(parsed && Array.isArray(parsed.cast)){
                    storedPeople.push(...parsed.cast);
                    return;
                }
                if(parsed && Array.isArray(parsed.credits)){
                    storedPeople.push(...parsed.credits);
                    return;
                }
                if(parsed && Array.isArray(parsed.crew)){
                    storedPeople.push(...parsed.crew);
                    return;
                }
            }catch(e){}

            const simple = raw.split(/[,\n|]+/).map(x=>x.trim()).filter(Boolean);
            if(simple.length) storedPeople.push(...simple);
            return;
        }

        if(typeof raw === "object"){
            if(Array.isArray(raw.cast)) storedPeople.push(...raw.cast);
            if(Array.isArray(raw.credits)) storedPeople.push(...raw.credits);
            if(Array.isArray(raw.crew)) storedPeople.push(...raw.crew);
        }
    };

    addStored(movie.cast_data);
    addStored(movie.crew_data);

    if(storedPeople.length) return storedPeople;

    const candidates = [
        movie.cast, movie.cast_crew, movie.credits,
        movie.actors, movie.cast_json, movie.crew
    ];

    for(const raw of candidates){
        if(!raw) continue;
        if(Array.isArray(raw)) return raw;

        if(typeof raw === "string"){
            try{
                const parsed = JSON.parse(raw);
                if(Array.isArray(parsed)) return parsed;
                if(parsed && Array.isArray(parsed.cast)) return parsed.cast;
                if(parsed && Array.isArray(parsed.credits)) return parsed.credits;
                if(parsed && Array.isArray(parsed.crew)) return parsed.crew;
            }catch(e){
                const simple = raw.split(/[,\n|]+/).map(x=>x.trim()).filter(Boolean);
                if(simple.length) return simple;
            }
        }

        if(typeof raw === "object"){
            if(Array.isArray(raw.cast)) return raw.cast;
            if(Array.isArray(raw.credits)) return raw.credits;
            if(Array.isArray(raw.crew)) return raw.crew;
        }
    }
    return [];
}

function getPoster(movie,tmdb){
    return first(
        imageFrom(movie.poster_url),
        imageFrom(movie.poster),
        imageFrom(movie.thumbnail),
        tmdbImage(tmdb?.poster_path,"w780"),
        "https://via.placeholder.com/780x1170/0b1420/ffffff?text=CINEFLIX"
    );
}

function getBackdrop(movie,tmdb){
    return first(
        imageFrom(movie.backdrop_url),
        imageFrom(movie.backdrop),
        imageFrom(movie.backdrop_image),
        imageFrom(movie.hero_image),
        tmdbImage(first(
            movie.tmdb_backdrop_path,
            movie.tmdbBackdropPath,
            movie.backdrop_path
        ),"original"),
        tmdbImage(tmdb?.backdrop_path,"original"),
        getPoster(movie,tmdb)
    );
}

/* =========================================================
   TMDB
========================================================= */

async function getTMDBTokenAsync(){
    const local = getTMDBToken();
    if(local) return local;
    try{
        const {data,error} = await supabaseClient
            .from("admin_settings")
            .select("tmdb_token,updated_at")
            .order("updated_at",{ascending:false})
            .limit(1);
        if(!error && Array.isArray(data) && data[0]?.tmdb_token){
            const token = String(data[0].tmdb_token).trim();
            try{
                localStorage.setItem("cineflix_tmdb_token",token);
                sessionStorage.setItem("cineflix_tmdb_token",token);
            }catch{}
            return token;
        }
    }catch{}
    return "";
}

async function fetchTMDB(movie){
    const token = await getTMDBTokenAsync();
    if(!token) return null;

    const headers = {
        accept: "application/json",
        Authorization: `Bearer ${token}`
    };

    const tmdbFetch = async (url) => {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 8000);
        try {
            return await fetch(url,{headers,cache:"no-store",signal:controller.signal});
        } finally {
            clearTimeout(timer);
        }
    };

    const explicitId = first(
        movie.tmdb_id, movie.tmdbId,
        movie.tmdb_movie_id, movie.tmdb_movieid
    );

    try{
        let movieIdToFetch = explicitId;

        if(!movieIdToFetch){
            const title = first(movie.title,movie.name,movie.original_title,movie.original_name);
            if(!title) return null;

            const year = first(
                movie.year,
                movie.release_year,
                String(movie.release_date || movie.first_air_date || "").slice(0,4)
            );

            const searchUrl = new URL("https://api.themoviedb.org/3/search/movie");
            searchUrl.searchParams.set("query",String(title));
            searchUrl.searchParams.set("language","en-US");
            searchUrl.searchParams.set("page","1");
            searchUrl.searchParams.set("include_adult","false");
            if(year) searchUrl.searchParams.set("year",String(year));

            const searchResponse = await tmdbFetch(searchUrl.toString());
            if(!searchResponse.ok) return null;

            const searchData = await searchResponse.json();
            const results = Array.isArray(searchData?.results) ? searchData.results : [];
            if(!results.length) return null;

            const wanted = String(title).trim().toLowerCase();
            const exact = results.find(item =>
                String(item?.title || item?.name || "").trim().toLowerCase() === wanted
            );
            movieIdToFetch = (exact || results[0])?.id;
            if(!movieIdToFetch) return null;
        }

        const detailUrl = new URL(
            `https://api.themoviedb.org/3/movie/${encodeURIComponent(movieIdToFetch)}`
        );
        detailUrl.searchParams.set("language","en-US");
        detailUrl.searchParams.set("append_to_response","credits,images,videos");
        detailUrl.searchParams.set("include_image_language","en,null");

        const imageUrl = new URL(
            `https://api.themoviedb.org/3/movie/${encodeURIComponent(movieIdToFetch)}/images`
        );
        /* Do NOT filter the gallery by language here. TMDB can otherwise
           return only a single matching backdrop on some mobile/browser
           requests. We want the complete backdrop gallery. */

        /* Do not block the movie page on the optional /images request.
           The detail endpoint already includes images. */
        const response = await tmdbFetch(detailUrl.toString());
        if(!response.ok) return null;

        const data = await response.json();

        /* Get the dedicated backdrop list before rendering.
           This is important on mobile: the detail response can contain
           only a main backdrop, while /images contains the full gallery. */
        try{
            const imageResponse = await tmdbFetch(imageUrl.toString());
            if(imageResponse?.ok){
                const imageData = await imageResponse.json();
                if(Array.isArray(imageData?.backdrops) && imageData.backdrops.length){
                    data.images = data.images || {};
                    data.images.backdrops = imageData.backdrops;
                }
            }
        }catch{}

        return data;
    }catch(error){
        return null;
    }
}

function makeInfo(movie,tmdb){
    const release = first(
        movie.release_date,
        movie.releaseDate,
        movie.year ? String(movie.year) : "",
        tmdb?.release_date,
        ""
    );

    const type = String(first(movie.type,movie.category,tmdb ? "MOVIE" : "MOVIE")).toUpperCase();

    const genres = getGenres(movie);
    const tmdbGenres = (tmdb?.genres || []).map(x=>x.name).filter(Boolean);
    const category = genres.length ? genres.join(" / ") : (tmdbGenres.length ? tmdbGenres.join(" / ") : "Movie");

    const runtime = formatRuntime(first(
        movie.runtime,
        movie.duration,
        movie.duration_minutes,
        tmdb?.runtime,
        ""
    ));

    const language = first(
        movie.language,
        movie.languages,
        movie.lang,
        tmdb?.original_language,
        "EN"
    );

    const audio = first(
        movie.audio,
        movie.audio_language,
        movie.audio_languages,
        "Hindi 5.1 • English 5.1"
    );

    const quality = first(
        movie.quality,
        movie.qualities,
        movie.video_quality,
        "1080p • 720p • 480p"
    );

    const subtitles = first(
        movie.subtitles,
        movie.subtitle,
        movie.subtitle_languages,
        "Hindi • English"
    );

    return [
        ["Release Date",release,icons.calendar],
        ["Type",type,icons.globe],
        ["Category",category,icons.tag],
        ["Runtime",runtime,icons.clock],
        ["Language",String(language).toUpperCase(),icons.globe],
        ["Audio",audio,icons.audio],
        ["Quality",quality,icons.hd],
        ["Subtitles",subtitles,icons.subtitles]
    ];
}

function normalizeCast(movie,tmdb){
    if(tmdb?.credits){
        const cast = Array.isArray(tmdb.credits.cast)
            ? tmdb.credits.cast
                .filter(person=>person && person.name)
                .sort((a,b)=>(Number(a.order)||9999)-(Number(b.order)||9999))
                .slice(0,18)
                .map(person=>({
                    name:person.name,
                    role:person.character || "Cast",
                    photo:tmdbImage(person.profile_path,"w185")
                }))
            : [];

        const crewJobs = new Set([
            "Director","Writer","Screenplay","Producer",
            "Executive Producer","Cinematography","Director of Photography",
            "Editor","Original Music Composer","Music","Composer"
        ]);

        const crew = Array.isArray(tmdb.credits.crew)
            ? tmdb.credits.crew
                .filter(person=>person && person.name && crewJobs.has(person.job))
                .map(person=>({
                    name:person.name,
                    role:person.job || "Crew",
                    photo:tmdbImage(person.profile_path,"w185")
                }))
            : [];

        const people = [...cast,...crew];
        const seen = new Set();
        return people.filter(person=>{
            const key=String(person.name).toLowerCase();
            if(seen.has(key)) return false;
            seen.add(key);
            return true;
        }).slice(0,30);
    }

    const own = getPeople(movie);
    if(own.length){
        return own.slice(0,30).map(person=>{
            if(typeof person === "string") return {name:person,role:"Cast",photo:""};
            return {
                name:first(person.name,person.title,"Cast"),
                role:first(person.character,person.role,person.job,"Cast"),
                photo:first(
                    imageFrom(person.profile_url),
                    imageFrom(person.profile_path),
                    imageFrom(person.profile),
                    imageFrom(person.image),
                    imageFrom(person.photo),
                    tmdbImage(person.profile_path,"w185"),
                    tmdbImage(person.profile,"w185"),
                    ""
                )
            };
        });
    }
    return [];
}

/* =========================================================
   CLIPS
========================================================= */

function normalizeClips(movie,tmdb){
    /*
       MOBILE-SAFE BACKDROP CAROUSEL

       Priority:
       1) Images already saved in Supabase (works without TMDB token)
       2) Other movie-owned clip/gallery/still fields
       3) TMDB backdrops
       4) TMDB main backdrop
       5) Movie poster

       Important: never return [] just because TMDB is unavailable.
       This is what caused the mobile browser to show no images when
       the phone did not have a cached TMDB token.
    */

    const toImageList = raw => {
        if(!raw) return [];

        /* Handle JSON strings, arrays, and objects such as
           {backdrops:[...]} or {images:[...]}. */
        if(typeof raw === "string"){
            try{
                const parsed = JSON.parse(raw);
                return toImageList(parsed);
            }catch(e){
                return raw.split(",").map(x=>x.trim()).filter(Boolean);
            }
        }

        if(Array.isArray(raw)) return raw;

        if(typeof raw === "object"){
            if(Array.isArray(raw.backdrops)) return raw.backdrops;
            if(Array.isArray(raw.images)) return raw.images;
            if(Array.isArray(raw.clips)) return raw.clips;
            return [raw];
        }

        return [];
    };

    const normalizeList = raw => toImageList(raw)
        .map(item=>{
            if(typeof item === "string"){
                return {image:item,quote:""};
            }

            return {
                image:first(
                    imageFrom(item?.image),
                    imageFrom(item?.url),
                    imageFrom(item?.src),
                    imageFrom(item?.file_path),
                    ""
                ),
                quote:first(item?.quote,item?.caption,item?.text,"")
            };
        })
        .filter(x=>x.image);

    /* 1. SUPABASE-SAVED IMAGES — no TMDB token required */
    const savedSources = [
        movie.images,
        movie.backdrop_images,
        movie.tmdb_backdrops
    ];

    let saved = [];
    for(const source of savedSources){
        const list = normalizeList(source);
        if(list.length) saved.push(...list);
    }

    const savedSeen = new Set();
    const savedUnique = saved.filter(x=>{
        if(!x.image || savedSeen.has(x.image)) return false;
        savedSeen.add(x.image);
        return true;
    }).slice(0,5);

    /* If all 5 were saved by Admin, use them directly.
       If fewer are saved, keep collecting from TMDB instead of turning
       the mobile carousel into a 1/1 carousel. */
    if(savedUnique.length >= 5) return savedUnique;

    /* 2. MOVIE-OWNED CLIPS / STILLS / GALLERY — also works without TMDB */
    const ownSources = [
        movie.clips,
        movie.stills,
        movie.screenshots,
        movie.gallery
    ];

    let own = [];
    for(const source of ownSources){
        const list = normalizeList(source);
        if(list.length) own.push(...list);
    }

    const ownSeen = new Set();
    const ownUnique = own.filter(x=>{
        if(!x.image || ownSeen.has(x.image)) return false;
        ownSeen.add(x.image);
        return true;
    }).slice(0,5);

    if(ownUnique.length >= 5) return ownUnique;

    /* 3. TMDB BACKDROPS */
    const allTmdbBackdrops = Array.isArray(tmdb?.images?.backdrops)
        ? tmdb.images.backdrops.filter(x=>x && x.file_path)
        : [];

    /* Use the middle 5 backdrops (4th–8th). If TMDB has fewer than 8,
       gracefully use the best available 5 instead of falling to 1/1. */
    const selectedTmdbBackdrops = allTmdbBackdrops.length >= 8
        ? allTmdbBackdrops.slice(3,8)
        : allTmdbBackdrops.slice(0,5);

    const tmdbBackdrops = selectedTmdbBackdrops.map(x=>({
        image:tmdbImage(x.file_path,"original"),
        quote:""
    }));

    const tmdbSeen = new Set();
    const uniqueBackdrops = tmdbBackdrops.filter(x=>{
        if(!x.image || tmdbSeen.has(x.image)) return false;
        tmdbSeen.add(x.image);
        return true;
    }).slice(0,5);

    if(uniqueBackdrops.length) return uniqueBackdrops;

    /* 4. TMDB MAIN BACKDROP */
    if(tmdb?.backdrop_path){
        return [{
            image:tmdbImage(tmdb.backdrop_path,"original"),
            quote:""
        }];
    }

    /* 5. FINAL POSTER FALLBACK */
    const poster = getPoster(movie,tmdb);
    return poster ? [{image:poster,quote:""}] : [];
}

function openQualityPage(mId, mTitle, tvEpisode=null) {

    if(tvEpisode!==null&&tvEpisode!==undefined) sessionStorage.setItem(`active_tv_episode_${mId}`,String(tvEpisode));

    const movieSlug = (mTitle || 'movie')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/(^-|-$)+/g, '');

    const ep=(tvEpisode!==null&&tvEpisode!==undefined&&String(tvEpisode)!=="")?`&episode=${encodeURIComponent(tvEpisode)}`:"";
    window.location.href = `${WATCH_PAGE}?id=${mId}&movie=${encodeURIComponent(movieSlug)}${ep}`;
}

function getTvShowData(movie){
    const raw=movie?.qualities_data;
    if(!raw || Array.isArray(raw) || typeof raw!="object" || raw.__type!=="tv_show_v1") return null;
    return raw;
}

function tmdbEpisodeImage(path){
    return path ? `https://image.tmdb.org/t/p/w780${path}` : "";
}

function formatEpisodeDate(value){
    if(!value) return "";
    const raw=String(value).trim();
    const d=new Date(raw.length===10?`${raw}T00:00:00`:raw);
    if(Number.isNaN(d.getTime())) return raw;
    return d.toLocaleDateString("en-GB",{day:"2-digit",month:"long",year:"numeric"});
}

function formatEpisodeDuration(minutes){
    const n=Number(minutes);
    if(!Number.isFinite(n)||n<=0) return "";
    const h=Math.floor(n/60);
    const m=n%60;
    if(h>0) return `${String(h).padStart(2,"0")}h ${String(m).padStart(2,"0")}min`;
    return `${String(m).padStart(2,"0")}min`;
}

function renderTvEpisodes(movie,tmdb){
    const data=getTvShowData(movie);
    const section=document.getElementById("tvEpisodesSection");
    const row=document.getElementById("tvEpisodesRow");
    const counter=document.getElementById("tvEpisodesCounter");
    if(!section||!row)return;
    if(!data){section.classList.add("hidden");return;}

    const seasons=Array.isArray(data.seasons)?data.seasons:[];
    const seasonNumber=Number(data.active_season||seasons[0]?.season_number||0);
    const season=seasons.find(s=>Number(s.season_number)===seasonNumber)||seasons[0];
    const episodes=Array.isArray(season?.episodes)?season.episodes:[];
    if(!episodes.length){section.classList.add("hidden");return;}

    section.classList.remove("hidden");
    if(counter)counter.textContent=`Total ${episodes.length} Episodes`;
    row.innerHTML=episodes.map((ep,i)=>{
        const image=tmdbEpisodeImage(ep.still_path)||getBackdrop(movie,tmdb);
        return `<button type="button" class="tv-episode-card ${i===0?"active":""}" data-episode="${Number(ep.episode_number)}" data-index="${i}" data-image="${esc(image)}">
            <span class="tv-episode-media">
                <img class="tv-episode-thumb" src="${esc(image)}" alt="${esc(ep.name||`Episode ${ep.episode_number}`)}" loading="${i<2?"eager":"lazy"}" decoding="async">
                <span class="tv-episode-gradient"></span>
                <span class="tv-episode-number">EPISODE ${Number(ep.episode_number)}</span>
                <span class="tv-episode-active">SELECTED</span>
                <span class="tv-episode-meta"><span class="tv-episode-date">${esc(formatEpisodeDate(ep.air_date))}</span>${ep.runtime?` <span class="tv-episode-duration"><span class="tv-duration-icon">${icons.clock}</span>${esc(formatEpisodeDuration(ep.runtime))}</span>`:""}</span>
            </span>
            <span class="tv-episode-body"><span class="tv-episode-name">${esc(ep.name||`Episode ${ep.episode_number}`)}</span></span>
        </button>`;
    }).join("");

    const activate=(ep)=>{
        const selected=episodes.find(x=>Number(x.episode_number)===Number(ep))||episodes[0];
        const download=document.getElementById("downloadNowBtn");
        const downloadLabel=document.getElementById("downloadNowLabel");
        if(download){
            download.dataset.tvEpisode=String(selected.episode_number);
            if(downloadLabel) downloadLabel.textContent=`Download Now - EP ${Number(selected.episode_number)}`;
        }
        row.querySelectorAll(".tv-episode-card").forEach(card=>card.classList.toggle("active",Number(card.dataset.episode)===Number(selected.episode_number)));
        const image=tmdbEpisodeImage(selected.still_path)||getBackdrop(movie,tmdb);
        const backdropImg=document.getElementById("backdropImg");
        if(backdropImg&&image)backdropImg.src=image;
        // Make the selected episode backdrop the first Movie Clip too.
        const firstClip=document.querySelector("#clipTrack .clip-slide img");
        if(firstClip&&image)firstClip.src=image;
        try{sessionStorage.setItem(`cineflix_tv_episode_${movie.id}`,String(selected.episode_number));}catch{}
        const activeCard=row.querySelector(`.tv-episode-card[data-episode="${Number(selected.episode_number)}"]`);
        const idx=activeCard?Number(activeCard.dataset.index)||0:0;
        prevBtn?.classList.toggle("is-disabled",idx<=0);
        nextBtn?.classList.toggle("is-disabled",idx>=episodes.length-1);
    };

    row.querySelectorAll(".tv-episode-card").forEach(card=>card.addEventListener("click",()=>{
        activate(Number(card.dataset.episode));
        // Keep Download Now tied to the selected episode.
        const download=document.getElementById("downloadNowBtn");
        if(download){download.dataset.tvEpisode=String(card.dataset.episode);}
    }));

    const prevBtn=document.getElementById("tvEpisodePrev");
    const nextBtn=document.getElementById("tvEpisodeNext");
    const getCurrentIndex=()=>{
        const active=row.querySelector(".tv-episode-card.active");
        if(active)return Number(active.dataset.index)||0;
        return 0;
    };
    const updateEpisodeNav=()=>{
        const idx=getCurrentIndex();
        prevBtn?.classList.toggle("is-disabled",idx<=0);
        nextBtn?.classList.toggle("is-disabled",idx>=episodes.length-1);
    };
    const selectEpisodeByIndex=(idx)=>{
        const safe=Math.max(0,Math.min(episodes.length-1,idx));
        const card=row.querySelector(`.tv-episode-card[data-index="${safe}"]`);
        if(!card)return;
        activate(Number(card.dataset.episode));
        card.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});
        updateEpisodeNav();
    };
    prevBtn?.addEventListener("click",()=>selectEpisodeByIndex(getCurrentIndex()-1));
    nextBtn?.addEventListener("click",()=>selectEpisodeByIndex(getCurrentIndex()+1));

    let savedEpisode=1;
    try{savedEpisode=Number(sessionStorage.getItem(`cineflix_tv_episode_${movie.id}`)||1);}catch{}
    if(!episodes.some(x=>Number(x.episode_number)===savedEpisode))savedEpisode=Number(episodes[0].episode_number);
    activate(savedEpisode);
}

function initInteractions(movie,clips,similar,tmdb){
    // Download Now Button Action (FIXED REDIRECT)
    const downloadNowBtn = document.getElementById("downloadNowBtn");
    if(downloadNowBtn){
        downloadNowBtn.onclick = (e) => {
            e.preventDefault();
            const targetId = movieId || (movie && movie.id);
            const currentTitle = first(movie.title, movie.name, "Movie");
            const tvData=getTvShowData(movie);
            let tvEpisode=null;
            if(tvData){
                tvEpisode=downloadNowBtn.dataset.tvEpisode||null;
                if(!tvEpisode){try{tvEpisode=sessionStorage.getItem(`cineflix_tv_episode_${movie.id}`)||"1";}catch{tvEpisode="1";}}
            }
            openQualityPage(targetId, currentTitle, tvEpisode);
        };
    }

    async function shareMovie(){
        const shareData = {
            title: document.title,
            text: `Watch ${first(movie.title,movie.name,"this movie")} on CINEFLIX`,
            url: location.href
        };

        try{
            if(navigator.share){
                await navigator.share(shareData);
            }else if(navigator.clipboard){
                await navigator.clipboard.writeText(location.href);
                alert("Movie link copied!");
            }else{
                prompt("Copy movie link:", location.href);
            }
        }catch(e){}
    }

    document.getElementById("shareBtn").onclick = shareMovie;

    const playerOverlay = document.getElementById("playerOverlay");
    const playerVideo = document.getElementById("playerVideo");
    const playerClose = document.getElementById("playerClose");
    const playerLoading = document.getElementById("playerLoading");
    const playerEmpty = document.getElementById("playerEmpty");

    function youtubeTrailerUrl(movie, tmdb){
        const saved = first(movie?.trailer_url, movie?.trailerUrl, movie?.trailer, "");
        const videos = Array.isArray(tmdb?.videos?.results) ? tmdb.videos.results : [];

        const pick = videos.find(v =>
            v && v.site === "YouTube" && v.key &&
            String(v.type || "").toLowerCase() === "trailer" &&
            String(v.official ?? true) !== "false"
        ) || videos.find(v =>
            v && v.site === "YouTube" && v.key &&
            String(v.type || "").toLowerCase() === "trailer"
        ) || videos.find(v => v && v.site === "YouTube" && v.key);

        let key = "";
        if(saved){
            try{
                const u = new URL(saved);
                if(/youtube\.com$|www\.youtube\.com$/i.test(u.hostname)){
                    key = u.searchParams.get("v") || ((u.pathname.match(/\/embed\/([^/]+)/)||[])[1] || "");
                }else if(/youtu\.be$/i.test(u.hostname)){
                    key = u.pathname.slice(1).split("/")[0];
                }
            }catch{}
        }
        key = key || pick?.key || "";
        return key ? `https://www.youtube.com/embed/${encodeURIComponent(key)}?autoplay=1&rel=0&modestbranding=1&playsinline=1` : "";
    }

    function closePlayer(){
        playerOverlay.classList.remove("open");
        playerOverlay.setAttribute("aria-hidden","true");
        playerVideo.src = "about:blank";
        document.body.style.overflow="";
        playerLoading.classList.add("hidden");
        playerEmpty.classList.add("hidden");
    }

    function openPlayer(){
        const trailer = youtubeTrailerUrl(movie,tmdb);

        playerOverlay.classList.add("open");
        playerOverlay.setAttribute("aria-hidden","false");
        document.body.style.overflow="hidden";
        playerEmpty.classList.add("hidden");

        if(!trailer){
            playerVideo.src="about:blank";
            playerLoading.classList.add("hidden");
            playerEmpty.innerHTML=`
                <div>
                    <strong>Trailer not available</strong>
                    TMDB does not have a YouTube trailer for this movie.
                </div>`;
            playerEmpty.classList.remove("hidden");
            return;
        }

        playerLoading.classList.remove("hidden");
        playerVideo.src=trailer;

        setTimeout(()=>playerLoading.classList.add("hidden"),700);
    }

    document.getElementById("watchBtn").onclick=openPlayer;
    playerClose.onclick=closePlayer;

    playerOverlay.addEventListener("click",(e)=>{
        if(e.target===playerOverlay) closePlayer();
    });

    document.addEventListener("keydown",(e)=>{
        if(e.key==="Escape" && playerOverlay.classList.contains("open")){
            closePlayer();
        }
    });

    const header = document.getElementById("header");
    const searchBtn = document.getElementById("headerSearchBtn");
    const searchBox = document.getElementById("headerSearchBox");
    const searchInput = document.getElementById("headerSearchInput");
    const searchSubmit = document.getElementById("headerSearchSubmit");
    const searchSuggestions = document.getElementById("headerSearchSuggestions");
    let searchTimer = null;

    const searchIcon = `<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>`;
    const closeIcon = `<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>`;

    const closeMovieSearch = () => {
        searchBox?.classList.remove("open");
        if(searchBtn){
            searchBtn.innerHTML=searchIcon;
            searchBtn.setAttribute("aria-label","Open search");
        }
        if(searchInput) searchInput.value="";
        searchSuggestions?.classList.remove("show");
        if(searchSuggestions) searchSuggestions.innerHTML="";
    };

    const openMovieSearch = () => {
        searchBox?.classList.add("open");
        if(searchBtn){
            searchBtn.innerHTML=closeIcon;
            searchBtn.setAttribute("aria-label","Close search");
        }
        setTimeout(()=>searchInput?.focus(),80);
    };

    const goToSearch = (q) => {
        q=String(q||"").trim();
        if(q) location.href = `index.html?search=${encodeURIComponent(q)}`;
    };

    const renderMovieSearchSuggestions = (rows) => {
        if(!searchSuggestions) return;
        searchSuggestions.innerHTML="";
        rows.slice(0,8).forEach(movie=>{
            const b=document.createElement("button");
            b.type="button";
            b.className="search-suggestion";
            b.innerHTML=`<img src="${movie.poster_url||""}" alt="${movie.title||""}"><span class="search-suggestion-info"><span class="search-suggestion-title">${movie.title||""}</span><span class="search-suggestion-meta">${movie.year||""}${movie.year&&movie.category?" • ":""}${movie.category||"Movie"}</span></span>`;
            b.addEventListener("click",()=>goToSearch(movie.title));
            searchSuggestions.appendChild(b);
        });
        searchSuggestions.classList.toggle("show",rows.length>0);
    };

    const loadMovieSearchSuggestions = async (q) => {
        if(!q || !searchSuggestions) return;
        try{
            const {data,error}=await supabaseClient
                .from("movies")
                .select("id,title,year,poster_url,category")
                .ilike("title",`%${q}%`)
                .order("title",{ascending:true})
                .limit(8);
            if(error) throw error;
            renderMovieSearchSuggestions(Array.isArray(data)?data:[]);
        }catch(error){
            console.error("CINEFLIX header search failed:",error);
            searchSuggestions.classList.remove("show");
        }
    };

    /* Search button is rendered dynamically inside #app.
       Use a direct listener here, with a document-level fallback added
       after loadMovie() so the icon remains clickable even if the header
       is rebuilt by the movie renderer. */
    if(searchBtn){
        searchBtn.onclick=null;
        searchBtn.addEventListener("click",e=>{
            e.preventDefault();
            e.stopPropagation();
            if(searchBox?.classList.contains("open")) closeMovieSearch();
            else openMovieSearch();
        });
    }

    searchSubmit?.addEventListener("click",e=>{
        e.preventDefault();
        e.stopPropagation();
        goToSearch(searchInput?.value);
    });

    searchInput?.addEventListener("input",()=>{
        clearTimeout(searchTimer);
        const q=searchInput.value.trim();
        if(!q){
            searchSuggestions?.classList.remove("show");
            return;
        }
        searchTimer=setTimeout(()=>loadMovieSearchSuggestions(q),120);
    });

    searchInput?.addEventListener("keydown",(e)=>{
        if(e.key === "Enter"){
            e.preventDefault();
            goToSearch(searchInput.value);
        }
        if(e.key === "Escape") closeMovieSearch();
    });

    document.addEventListener("click",e=>{
        if(searchBox && !searchBox.contains(e.target) && !searchBtn?.contains(e.target)){
            searchSuggestions?.classList.remove("show");
        }
    });

    window.addEventListener("scroll",()=>{
        header?.classList.toggle("scrolled",window.scrollY > 40);
    },{passive:true});

    document.getElementById("infoMore").onclick = () => {
        document.querySelector(".info-card").scrollIntoView({
            behavior:"smooth",
            block:"center"
        });
    };

    /* TMDB Backdrop Clips Carousel */
    let clipIndex = 0;
    const track = document.getElementById("clipTrack");
    const dots = [...document.querySelectorAll(".clip-dot")];
    const counter = document.getElementById("clipCounter");
    const prevBtn = document.getElementById("clipPrev");
    const nextBtn = document.getElementById("clipNext");

    function getClipStep(){
        if(!track) return 0;
        const slide = track.querySelector(".clip-slide");
        if(!slide) return 0;
        const gap = parseFloat(getComputedStyle(track).gap) || 0;
        return slide.getBoundingClientRect().width + gap;
    }

    function getVisibleSlides(){
        return window.matchMedia("(max-width: 600px)").matches ? 1 : 2.5;
    }

    function showClip(index){
        if(!clips.length || !track) return;

        const maxIndex = Math.max(0, Math.floor(clips.length - getVisibleSlides()));
        index = Math.max(0,Math.min(index,maxIndex));
        clipIndex = index;

        track.style.transform = `translate3d(${-getClipStep()*index}px,0,0)`;

        /* On desktop each position shows two backdrops, on mobile one. */
        const visible=getVisibleSlides();
        const dotMaxIndex=Math.max(0,clips.length-visible);
        dots.forEach((dot,i)=>{
            dot.style.display=i<=dotMaxIndex?"block":"none";
            dot.classList.toggle("active",i===index);
        });
        if(counter){
            if(window.matchMedia("(max-width: 600px)").matches){
                counter.textContent=`${index+1} / ${clips.length}`;
            }else{
                const end=Math.min(index+2,clips.length);
                counter.textContent=`${index+1}–2.5 / ${clips.length}`;
            }
        }
    }

    track?.querySelectorAll("img").forEach(img=>{
        img.addEventListener("error",()=>{
            if(img.src !== poster) img.src = poster;
        },{once:true});
    });

    prevBtn?.addEventListener("click",()=>{
        const maxIndex=Math.max(0,Math.floor(clips.length-getVisibleSlides()));
        showClip(clipIndex<=0 ? maxIndex : clipIndex-1);
    });

    nextBtn?.addEventListener("click",()=>{
        const maxIndex=Math.max(0,Math.floor(clips.length-getVisibleSlides()));
        showClip(clipIndex>=maxIndex ? 0 : clipIndex+1);
    });

    dots.forEach(dot=>{
        dot.onclick=()=>showClip(Number(dot.dataset.index));
    });

    /* Smooth touch / mouse swipe for Movie Clips */
    const clipsWrap=document.getElementById("clipsWrap");
    let swipeStartX=0, swipeStartY=0, swiping=false, swipeMoved=false;
    clipsWrap?.addEventListener("pointerdown",e=>{
        if(e.pointerType === "mouse" && e.button !== 0) return;
        swipeStartX=e.clientX;
        swipeStartY=e.clientY;
        swiping=true;
        swipeMoved=false;
    },{passive:true});
    clipsWrap?.addEventListener("pointermove",e=>{
        if(!swiping) return;
        const dx=e.clientX-swipeStartX;
        const dy=e.clientY-swipeStartY;
        if(Math.abs(dx)>10 && Math.abs(dx)>Math.abs(dy)){
            swipeMoved=true;
            e.preventDefault?.();
        }
    },{passive:false});
    const endSwipe=e=>{
        if(!swiping) return;
        const dx=e.clientX-swipeStartX;
        const dy=e.clientY-swipeStartY;
        swiping=false;
        if(Math.abs(dx)>=45 && Math.abs(dx)>Math.abs(dy)*1.15){
            const maxIndex=Math.max(0,Math.floor(clips.length-getVisibleSlides()));
            if(dx<0) showClip(clipIndex>=maxIndex ? 0 : clipIndex+1);
            else showClip(clipIndex<=0 ? maxIndex : clipIndex-1);
        }
    };
    clipsWrap?.addEventListener("pointerup",endSwipe,{passive:true});
    clipsWrap?.addEventListener("pointercancel",()=>{swiping=false},{passive:true});

    let clipResizeTimer;
    window.addEventListener("resize",()=>{
        clearTimeout(clipResizeTimer);
        clipResizeTimer=setTimeout(()=>showClip(clipIndex),120);
    },{passive:true});

    /* Auto-slide, like a marketplace banner carousel. */
    let clipAutoTimer=setInterval(()=>{
        if(document.hidden || !clips.length) return;
        const maxIndex=Math.max(0,Math.floor(clips.length-getVisibleSlides()));
        showClip(clipIndex>=maxIndex ? 0 : clipIndex+1);
    },5000);

    clipsWrap?.addEventListener("mouseenter",()=>clearInterval(clipAutoTimer));
    clipsWrap?.addEventListener("mouseleave",()=>{
        clearInterval(clipAutoTimer);
        clipAutoTimer=setInterval(()=>{
            if(document.hidden || !clips.length) return;
            const maxIndex=Math.max(0,Math.floor(clips.length-getVisibleSlides()));
            showClip(clipIndex>=maxIndex ? 0 : clipIndex+1);
        },5000);
    });

    showClip(0);

    /* Keyboard clip navigation */
    document.addEventListener("keydown",e=>{
        if(e.key==="ArrowLeft"){
            const maxIndex=Math.max(0,Math.floor(clips.length-getVisibleSlides()));
            showClip(clipIndex<=0 ? maxIndex : clipIndex-1);
        }
        if(e.key==="ArrowRight"){
            const maxIndex=Math.max(0,Math.floor(clips.length-getVisibleSlides()));
            showClip(clipIndex>=maxIndex ? 0 : clipIndex+1);
        }
    });

    /* Cast slider
       Native horizontal scrolling is used so vertical swipes continue
       scrolling the whole movie page normally on mobile. */
    const castRow = document.querySelector(".cast-row");
    if(castRow){
        castRow.style.touchAction = "pan-x pan-y";
    }

    /* Similar */
    document.querySelectorAll(".poster-card").forEach(card=>{
        card.onclick = () => {
            if(card.dataset.id){
                location.href = `movie.html?id=${encodeURIComponent(card.dataset.id)}`;
            }
        };
    });

    /* Keyboard clip navigation */
    document.addEventListener("keydown",e=>{
        if(e.key === "ArrowLeft") showClip(clipIndex-1);
        if(e.key === "ArrowRight") showClip(clipIndex+1);
    });
}

async function loadMovie(){
    // Keep the real page skeleton visible immediately while the movie record loads.
    showSkeleton();
    if(!movieId){
        showError("Movie ID missing","Open the details page from a movie card.");
        return;
    }

    try{
        const {data,error} = await supabaseClient
            .from("movies")
            .select("*")
            .eq("id",movieId)
            .single();

        if(error) throw error;
        if(!data) throw new Error("Movie not found");

        render(data,null,[]);

        const tmdbPromise = fetchTMDB(data);
        const similarPromise = (async()=>{
            try{
                const {data:rows} = await supabaseClient
                    .from("movies")
                    .select("*")
                    .neq("id",movieId)
                    .order("created_at",{ascending:false})
                    .limit(12);

                return Array.isArray(rows)
                    ? rows.filter(x=>x && x.id && (x.poster_url || x.poster || x.thumbnail)).slice(0,12)
                    : [];
            }catch(e){
                return [];
            }
        })();

        const [tmdb,similar] = await Promise.all([tmdbPromise,similarPromise]);

        if(tmdb || similar.length) render(data,tmdb,similar);

    }catch(error){
        console.error("CINEFLIX movie details error:",error);
        showError("Movie couldn't be loaded","Please check the movie ID and Supabase data.");
    }
}

    async function applyMovieUrlMask(movieTitle, categoryType, fullId) {
    if (!fullId) return;
    
    let typePath = "movie";
    if (categoryType && categoryType.toLowerCase().includes("series")) {
        typePath = "series";
    }

    let slug = (movieTitle || "title").toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
    let shortId = fullId.split('-')[0] || fullId.substring(0, 8);

    let maskedUrl = `${window.location.protocol}//${window.location.host}/${typePath}/${slug}/${shortId}.html?id=${fullId}`;
    
    if (window.history.pushState) {
        window.history.pushState({ path: maskedUrl }, '', maskedUrl);
    }
}
