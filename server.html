<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#07090d"
>

<title>CINEFLIX — Download Servers</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    min-height:100%;
    background:#07090d;
}

body{

    min-height:100vh;

    color:#f5f7fb;

    font-family:
        Inter,
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    background:

        radial-gradient(
            850px 430px at 80% -130px,
            rgba(229,9,20,.14),
            transparent 70%
        ),

        radial-gradient(
            700px 500px at 0% 50%,
            rgba(63,82,255,.075),
            transparent 70%
        ),

        #07090d;

    overflow-x:hidden;
}


/* =========================================================
   HEADER
========================================================= */

.header{

    width:100%;

    padding:
        18px clamp(16px,4vw,70px);

    display:flex;

    align-items:center;
    justify-content:space-between;

    border-bottom:
        1px solid rgba(255,255,255,.055);

    background:
        rgba(7,9,13,.62);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);
}

.logo{

    display:flex;

    align-items:center;

    gap:10px;

    color:#fff;

    text-decoration:none;

    font-size:
        clamp(18px,2vw,21px);

    font-weight:950;

    letter-spacing:-.7px;
}

.logo-box{

    width:32px;
    height:32px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:10px;

    color:#fff;

    background:
        linear-gradient(
            145deg,
            #ff2635,
            #c7000c
        );

    font-size:12px;

    font-weight:950;

    box-shadow:
        0 8px 25px rgba(229,9,20,.2);
}

.header-text{

    color:#59616c;

    font-size:8px;

    font-weight:850;

    letter-spacing:1.5px;

    text-transform:uppercase;
}


/* =========================================================
   MAIN
========================================================= */

.main{

    width:
        min(1080px, calc(100% - 32px));

    margin:
        0 auto;

    padding:
        clamp(27px,5vw,60px)
        0
        80px;
}


/* =========================================================
   STEPS
========================================================= */

.steps{

    display:flex;

    align-items:center;

    margin-bottom:22px;
}

.step{

    display:flex;

    align-items:center;

    gap:8px;

    color:#515a65;

    font-size:8px;

    font-weight:900;

    letter-spacing:1.4px;

    text-transform:uppercase;
}

.step.active{

    color:#e0e3e7;
}

.step-number{

    width:29px;
    height:29px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:9px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid rgba(255,255,255,.07);

    font-size:9px;
}

.step.active .step-number{

    color:#fff;

    background:#e50914;

    border-color:#e50914;

    box-shadow:
        0 7px 20px rgba(229,9,20,.2);
}

.step-line{

    width:
        clamp(25px,5vw,70px);

    height:1px;

    margin:
        0 11px;

    background:
        rgba(255,255,255,.08);
}


/* =========================================================
   MOVIE PANEL
========================================================= */

.movie-panel{

    position:relative;

    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        auto;

    gap:30px;

    align-items:center;

    padding:
        clamp(24px,4vw,35px);

    margin-bottom:25px;

    overflow:hidden;

    border:
        1px solid rgba(255,255,255,.075);

    border-radius:
        clamp(20px,3vw,27px);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.052),
            rgba(255,255,255,.016)
        );

    box-shadow:
        0 30px 90px rgba(0,0,0,.23);
}

.movie-panel::after{

    content:"";

    position:absolute;

    width:230px;
    height:230px;

    right:-100px;
    top:-120px;

    border-radius:50%;

    background:
        rgba(229,9,20,.075);

    filter:blur(35px);

    pointer-events:none;
}

.panel-content{

    position:relative;

    z-index:1;

    min-width:0;
}

.panel-label{

    margin-bottom:10px;

    color:#555e69;

    font-size:8px;

    font-weight:900;

    letter-spacing:1.7px;

    text-transform:uppercase;
}

.movie-title{

    color:#fff;

    font-size:
        clamp(
            26px,
            4.5vw,
            43px
        );

    line-height:1.07;

    font-weight:950;

    letter-spacing:-1.2px;

    overflow-wrap:anywhere;
}

.meta{

    display:flex;

    align-items:center;

    flex-wrap:wrap;

    gap:8px;

    margin-top:13px;

    color:#626a75;

    font-size:9px;

    font-weight:700;
}

.quality-pill{

    min-height:30px;

    padding:
        0 12px;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    border-radius:9px;

    color:#fff;

    background:
        rgba(229,9,20,.10);

    border:
        1px solid rgba(229,9,20,.20);

    font-size:8px;

    font-weight:900;

    letter-spacing:.5px;
}

.panel-icon{

    position:relative;

    z-index:1;

    width:
        clamp(58px,8vw,76px);

    height:
        clamp(58px,8vw,76px);

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:
        clamp(16px,2vw,21px);

    color:#e50914;

    background:
        rgba(229,9,20,.055);

    border:
        1px solid rgba(229,9,20,.13);

    font-size:
        clamp(22px,4vw,30px);
}


/* =========================================================
   SERVER HEADING
========================================================= */

.server-heading{

    display:flex;

    align-items:flex-end;

    justify-content:space-between;

    gap:20px;

    margin-bottom:14px;
}

.heading-title{

    color:#f1f3f6;

    font-size:
        clamp(13px,1.7vw,15px);

    font-weight:850;
}

.heading-sub{

    margin-top:4px;

    color:#555e69;

    font-size:9px;
}

.server-count{

    flex:none;

    color:#59616c;

    font-size:8px;

    font-weight:850;

    letter-spacing:1.2px;

    text-transform:uppercase;
}


/* =========================================================
   SERVER GRID
========================================================= */

.server-grid{

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:
        clamp(10px,1.5vw,14px);
}


/* =========================================================
   SERVER CARD
========================================================= */

.server-card{

    min-width:0;

    min-height:
        clamp(105px,12vw,125px);

    padding:
        clamp(14px,2vw,18px);

    display:grid;

    grid-template-columns:
        auto
        minmax(0,1fr)
        auto;

    align-items:center;

    gap:
        clamp(10px,1.5vw,14px);

    color:#fff;

    text-decoration:none;

    border:
        1px solid rgba(255,255,255,.07);

    border-radius:
        clamp(15px,2vw,19px);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.014)
        );

    transition:
        transform .22s ease,
        border-color .22s ease,
        background .22s ease,
        box-shadow .22s ease;
}

.server-card:hover{

    transform:
        translateY(-4px);

    border-color:
        rgba(229,9,20,.38);

    background:
        linear-gradient(
            135deg,
            rgba(229,9,20,.075),
            rgba(255,255,255,.018)
        );

    box-shadow:
        0 20px 48px rgba(0,0,0,.28);
}

.server-card:active{

    transform:
        scale(.985);
}


/* =========================================================
   SERVER ICON
========================================================= */

.server-icon{

    width:
        clamp(39px,5vw,46px);

    height:
        clamp(39px,5vw,46px);

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:
        clamp(11px,1.5vw,14px);

    color:#e9ebef;

    background:#10141b;

    border:
        1px solid rgba(255,255,255,.07);

    font-size:14px;

    font-weight:900;
}


/* =========================================================
   SERVER INFO
========================================================= */

.server-info{

    min-width:0;
}

.server-name{

    color:#ebedf1;

    font-size:
        clamp(12px,1.5vw,14px);

    font-weight:850;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.server-desc{

    margin-top:4px;

    color:#555e69;

    font-size:9px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.server-status{

    display:flex;

    align-items:center;

    gap:6px;

    margin-top:8px;

    color:#4ebc7d;

    font-size:7px;

    font-weight:850;

    letter-spacing:.6px;

    text-transform:uppercase;
}

.status-dot{

    width:5px;
    height:5px;

    flex:none;

    border-radius:50%;

    background:#42d07d;

    box-shadow:
        0 0 8px rgba(66,208,125,.65);
}


/* =========================================================
   ARROW
========================================================= */

.server-arrow{

    width:31px;
    height:31px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:9px;

    color:#5e6670;

    background:
        rgba(255,255,255,.035);

    font-size:13px;

    transition:.2s ease;
}

.server-card:hover .server-arrow{

    color:#fff;

    background:#e50914;

    transform:
        translateX(2px);
}


/* =========================================================
   LOADING
========================================================= */

.loading{

    grid-column:
        1 / -1;

    min-height:210px;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    color:#68717c;

    font-size:11px;

    border:
        1px solid rgba(255,255,255,.06);

    border-radius:18px;

    background:
        rgba(255,255,255,.015);
}

.spinner{

    width:31px;
    height:31px;

    margin-bottom:13px;

    border:
        3px solid rgba(255,255,255,.07);

    border-top-color:#e50914;

    border-radius:50%;

    animation:
        spin .7s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   MESSAGE
========================================================= */

.message{

    grid-column:
        1 / -1;

    padding:
        40px 20px;

    text-align:center;

    color:#68717c;

    font-size:11px;

    border:
        1px solid rgba(255,255,255,.06);

    border-radius:18px;

    background:
        rgba(255,255,255,.015);
}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    margin-top:20px;

    text-align:center;

    color:#3f4650;

    font-size:8px;

    letter-spacing:.6px;
}


/* =========================================================
   TABLET
========================================================= */

@media (min-width:701px) and (max-width:900px){

    .main{

        width:
            min(800px, calc(100% - 42px));
    }

    .movie-panel{

        padding:27px;
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .header{

        padding:
            14px 4%;
    }

    .header-text{
        display:none;
    }

    .main{

        width:
            calc(100% - 24px);

        padding:
            23px 0 55px;
    }

    .steps{

        margin-bottom:18px;
    }

    .step-line{

        width:27px;

        margin:
            0 8px;
    }

    .movie-panel{

        grid-template-columns:1fr;

        gap:0;

        padding:
            22px 17px;

        border-radius:19px;

        margin-bottom:23px;
    }

    .panel-icon{
        display:none;
    }

    .movie-title{

        font-size:
            clamp(27px,8vw,36px);
    }

    .server-grid{

        grid-template-columns:1fr;

    }

    .server-card{

        min-height:96px;

        border-radius:15px;
    }

}


/* =========================================================
   VERY SMALL PHONE
========================================================= */

@media(max-width:380px){

    .main{

        width:
            calc(100% - 18px);
    }

    .movie-panel{

        padding:
            19px 14px;
    }

    .movie-title{

        font-size:25px;
    }

    .server-card{

        min-height:91px;

        padding:13px;
    }

}


/* =========================================================
   LARGE DESKTOP
========================================================= */

@media(min-width:1400px){

    .main{

        width:1100px;

        padding-top:70px;
    }

    .server-grid{

        grid-template-columns:
            repeat(3,minmax(0,1fr));
    }

}

</style>

</head>


<body>


<header class="header">

    <a
        href="/zozomovie.github.io"
        class="logo"
    >

        <span class="logo-box">
            C
        </span>

        CINEFLIX

    </a>


    <div class="header-text">
        Download Center
    </div>

</header>



<main class="main">


    <!-- STEPS -->

    <div class="steps">

        <div class="step">

            <span class="step-number">
                01
            </span>

            Quality

        </div>


        <span class="step-line"></span>


        <div class="step active">

            <span class="step-number">
                02
            </span>

            Server

        </div>

    </div>



    <!-- MOVIE -->

    <section class="movie-panel">


        <div class="panel-content">

            <div class="panel-label">
                Ready to download
            </div>


            <h1
                class="movie-title"
                id="movieTitle"
            >
                Loading Movie...
            </h1>


            <div class="meta">

                <span
                    class="quality-pill"
                    id="qualityText"
                >
                    Selected Quality
                </span>


                <span>•</span>


                <span>
                    Multiple mirrors available
                </span>

            </div>

        </div>


        <div class="panel-icon">
            ↓
        </div>


    </section>



    <!-- SERVER TITLE -->

    <div class="server-heading">

        <div>

            <div class="heading-title">
                Available Download Servers
            </div>

            <div class="heading-sub">
                Choose any mirror to continue
            </div>

        </div>


        <div
            class="server-count"
            id="serverCount"
        >
            —
        </div>

    </div>



    <!-- SERVER GRID -->

    <div
        class="server-grid"
        id="serverContainer"
    >

        <div class="loading">

            <div class="spinner"></div>

            Finding available servers...

        </div>

    </div>



    <div class="footer">
        CINEFLIX • Direct mirror network
    </div>


</main>



<script>


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://bbqaagbypawcpszjwzii.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_dWktR3La6JpSwD32tfSb-Q_a__jx0cO";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   PARAMETERS
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


let movieId =
    params.get("id") ||
    sessionStorage.getItem(
        "active_movie_id"
    );


let qIndex =
    parseInt(
        params.get("q_index") ||
        sessionStorage.getItem(
            "active_q_index"
        ) ||
        "0",
        10
    );


let movieTitle =
    params.get("title") ||
    sessionStorage.getItem(
        "active_movie_title"
    ) ||
    "Movie Download";


let qualityName =
    params.get("quality") ||
    sessionStorage.getItem(
        "active_quality_name"
    ) ||
    "HD Quality";


if(movieId){

    sessionStorage.setItem(
        "active_movie_id",
        movieId
    );

    sessionStorage.setItem(
        "active_q_index",
        qIndex
    );

    sessionStorage.setItem(
        "active_movie_title",
        movieTitle
    );

    sessionStorage.setItem(
        "active_quality_name",
        qualityName
    );

    sessionStorage.setItem(
        "last_active_page",
        "server"
    );

}


/* =========================================================
   INITIAL TEXT
========================================================= */

document.getElementById(
    "movieTitle"
).textContent =
    movieTitle;


document.getElementById(
    "qualityText"
).textContent =
    qualityName;


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value || "")
        .replace(
            /[&<>"']/g,
            function(char){

                return {

                    "&":"&amp;",
                    "<":"&lt;",
                    ">":"&gt;",
                    '"':"&quot;",
                    "'":"&#039;"

                }[char];

            }
        );

}


/* =========================================================
   LOAD SERVERS
========================================================= */

async function loadServers(){

    const container =
        document.getElementById(
            "serverContainer"
        );

    const count =
        document.getElementById(
            "serverCount"
        );


    if(!movieId){

        container.innerHTML = `
            <div class="message">
                Movie ID missing.
            </div>
        `;

        return;
    }


    try{

        const {
            data,
            error
        } = await supabaseClient

            .from("movies")

            .select(
                "title, qualities_data"
            )

            .eq(
                "id",
                movieId
            )

            .single();


        if(
            error ||
            !data
        ){

            throw new Error(
                "Movie not found."
            );

        }


        if(data.title){

            document.getElementById(
                "movieTitle"
            ).textContent =
                data.title;

        }


        const qualities =
            Array.isArray(
                data.qualities_data
            )
                ? data.qualities_data
                : [];


        const selectedQuality =
            qualities[qIndex];


        if(!selectedQuality){

            count.textContent =
                "0 SERVERS";

            container.innerHTML = `
                <div class="message">
                    Selected quality was not found.
                </div>
            `;

            return;
        }


        const actualQuality =
            selectedQuality.quality_name ||
            qualityName;


        document.getElementById(
            "qualityText"
        ).textContent =
            actualQuality;


        const servers =
            Array.isArray(
                selectedQuality.servers
            )
                ? selectedQuality.servers
                : [];


        count.textContent =
            servers.length +
            (
                servers.length === 1
                    ? " SERVER"
                    : " SERVERS"
            );


        if(!servers.length){

            container.innerHTML = `
                <div class="message">
                    No download servers are available.
                </div>
            `;

            return;
        }


        container.innerHTML =
            servers.map(
                (server,index) => {

                    const name =
                        server.server_name ||
                        `Server ${index + 1}`;


                    const url =
                        server.url ||
                        "#";


                    return `

                        <a
                            href="${escapeHtml(url)}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="server-card"
                        >

                            <span class="server-icon">
                                ↗
                            </span>


                            <span class="server-info">

                                <span class="server-name">
                                    ${escapeHtml(name)}
                                </span>


                                <span class="server-desc">
                                    High speed mirror
                                </span>


                                <span class="server-status">

                                    <span class="status-dot"></span>

                                    Online

                                </span>

                            </span>


                            <span class="server-arrow">
                                →
                            </span>

                        </a>

                    `;

                }
            )
            .join("");


    }
    catch(error){

        console.error(error);


        container.innerHTML = `
            <div class="message">
                Unable to load download servers.
            </div>
        `;

    }

}


/* =========================================================
   START
========================================================= */

loadServers();

</script>

</body>
</html>
